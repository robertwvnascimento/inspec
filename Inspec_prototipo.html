/* ---------- LISTA POR CATEGORIA ---------- */
V.lista = (catId, q) => {
  const c = CAT[catId]; if (!c) return V.naoEncontrado();
  const aba = q.get('aba') || 'pendentes', ger = q.get('ger') ?? Store.s.ui.gerFiltro, lim = Number(q.get('lim') || 150);
  const todos = Store.s.equipamentos.filter(e => e.ativo && e.cat === catId && (!ger || e.ger === ger) && Regras.noMeuFiltro(e)).map(e => ({ e, s: Regras.situacao(e) }));
  const filtros = { pendentes: x => x.s.pendente, inspecionados: x => !x.s.pendente, perdidos: x => x.s.perdido, ncs: x => x.s.ncAberta, n2: x => Regras.n2(x.e)?.st === 'vencida', todos: () => true };
  const cont = k => todos.filter(filtros[k]).length;
  const lista = todos.filter(filtros[aba] || filtros.pendentes).sort((a, b) => a.e.ger.localeCompare(b.e.ger) || a.e.area.localeCompare(b.e.area) || a.e.codigo.localeCompare(b.e.codigo));
  let html = '', grp = '';
  for (const { e } of lista.slice(0, lim)) {
    const k = e.ger + '|' + e.area;
    if (k !== grp) { grp = k; const n = lista.filter(x => x.e.ger === e.ger && x.e.area === e.area).length; html += `<div class="group-h"><span>${esc(Store.ger(e.ger).sigla)} › ${esc(e.area)}</span><span>${n}</span></div>`; }
    html += Comp.linhaEq(e);
  }
  const base = `#/lista/${catId}?ger=${encodeURIComponent(ger)}`;
  const tab = (k, n) => `<a href="${base}&aba=${k}" role="tab" aria-selected="${aba === k}">${n} (${cont(k)})</a>`;
  return `
  <div class="tabs" role="tablist" aria-label="Filtro de situação">${tab('pendentes','Pendentes')}${tab('inspecionados','Inspecionados')}${tab('ncs','NC')}${tab('perdidos','Perdidos')}${catId === 'extintor' ? tab('n2','N2 vencida') : ''}${tab('todos','Todos')}</div>
  ${Regras.meusAtivo() && catId === 'extintor' ? `<p class="hint" style="margin:8px 2px 0">Mostrando só os seus pontos. <button class="linkbtn" data-action="meus" data-v="0" style="padding:0">Ver toda a equipe</button></p>` : ''}
  <div class="toolbar">${Comp.selectGerencia('f-ger-lista', ger)}${Regras.pode('inspecionar') ? `<a class="btn btn-navy" href="#/buscar?cat=${catId}">${ico('search')}Buscar em ${c.plural.toLowerCase()}</a>` : ''}</div>
  ${lista.length ? `<div class="list">${html}${lista.length > lim ? `<a class="more" href="${base}&aba=${aba}&lim=${lim + 150}" style="text-align:center;text-decoration:none">Mostrar mais (${lista.length - lim} restantes)</a>` : ''}</div>`
    : Comp.vazio('check', aba === 'pendentes' ? 'Nenhuma pendência' : 'Nada por aqui', aba === 'pendentes' ? `Todos os ${c.plural.toLowerCase()} deste filtro foram inspecionados no ciclo.` : 'Nenhum equipamento nesta situação.')}`;
};

/* ---------- BUSCAR (leitura de QR Code + busca por texto) ---------- */
const Busca = {
  termos: q => Util.norm(q).split(/\s+/).filter(Boolean),
  executar({ q, cats, ger, soPend }) {
    const termos = Busca.termos(q);
    const res = [];
    for (const e of Store.s.equipamentos) {
      if (!e.ativo) continue;
      if (cats.length && !cats.includes(e.cat)) continue;
      if (ger && e.ger !== ger) continue;
      const hay = Util.norm(Regras.textoBusca(e));
      if (!termos.every(t => hay.includes(t))) continue;
      const s = soPend || termos.length ? Regras.situacao(e) : null;
      if (soPend && !s.pendente) continue;
      const cod = Util.norm(e.codigo);
      let score = 0;
      for (const t of termos) { if (cod === t) score += 100; else if (cod.startsWith(t)) score += 40; else if (cod.includes(t)) score += 20; else if (Util.norm(e.area).includes(t)) score += 8; else score += 3; }
      if (s && s.pendente) score += 2;
      res.push({ e, score });
    }
    res.sort((a, b) => b.score - a.score || a.e.codigo.localeCompare(b.e.codigo));
    return { termos, res };
  }
};
V.buscar = (q) => {
  const st = Store._busca || (Store._busca = { q: '', cats: [], ger: '', soPend: true });
  if (q.get('cat')) st.cats = [q.get('cat')];
  return `
  <button type="button" class="scan-cta" data-action="scan-abrir"><span class="ic">${ico('scan')}</span><span><b>Ler QR Code</b><span>Aponte a câmera para a etiqueta do equipamento</span></span>${ico('chev')}</button>
  <div class="search-box">
    ${ico('search')}
    <label class="sr" for="busca">Buscar equipamento</label>
    <input class="input" id="busca" type="search" data-input="busca" value="${esc(st.q)}" placeholder="Ou digite código, tipo ou local…" autocomplete="off" enterkeyhint="search">
    <button class="iconbtn clear" data-action="limpar-busca" aria-label="Limpar busca" ${st.q ? '' : 'hidden'}>${ico('x')}</button>
  </div>
  <div class="chips" style="margin-top:10px" role="group" aria-label="Filtrar por categoria">
    ${CATEGORIAS.map(c => `<button class="chip" data-action="busca-cat" data-cat="${c.id}" aria-pressed="${st.cats.includes(c.id)}">${ico(c.icone)}${c.plural}</button>`).join('')}
    <button class="chip" data-action="busca-pend" aria-pressed="${st.soPend}">${ico('clock')}Só pendentes</button>
  </div>
  <div class="toolbar" style="margin-bottom:0">${Comp.selectGerencia('f-ger-busca', st.ger)}</div>
  <div id="busca-res" aria-live="polite">${V.buscaResultados()}</div>`;
};
V.buscaResultados = () => {
  const st = Store._busca;
  if (!st.q.trim()) return V.buscaSugestoes();
  const { termos, res } = Busca.executar(st);
  const ocultos = st.soPend ? Busca.executar({ ...st, soPend:false }).res.length - res.length : 0;
  const aviso = ocultos ? ` · <button class="linkbtn" data-action="busca-pend-off" style="padding:0">mostrar ${Util.plural(ocultos, 'já inspecionado', 'já inspecionados')}</button>` : '';
  if (!res.length) return (ocultos ? `<div class="res-count">Nenhum pendente${aviso}</div>` : '') + Comp.vazio('search', 'Nenhum equipamento encontrado', `Confira a grafia ou tente outro termo${st.soPend ? ' — o filtro “Só pendentes” está ligado' : ''}.`);
  const lim = 60;
  return `<div class="res-count">${Util.plural(res.length, 'resultado')}${res.length > lim ? ` · mostrando os ${lim} mais relevantes` : ''}${aviso}</div>
  <div class="list">${res.slice(0, lim).map(r => Comp.linhaEq(r.e, { termos })).join('')}</div>`;
};
V.buscaSugestoes = () => {
  const eu = Store.eu;
  const ultima = Store.s.inspecoes.filter(i => i.ins === eu.id && !i.anulada).sort((a, b) => b.dt.localeCompare(a.dt))[0];
  let area = '';
  if (ultima) {
    const e0 = Store.eq(ultima.eq);
    const pend = Store.s.equipamentos.filter(e => e.ativo && e.area === e0.area && Regras.situacao(e).pendente).slice(0, 6);
    if (pend.length) area = `<div class="card"><h3>${ico('map','sr-ico')}Continue na área: ${esc(e0.area)}</h3><p class="hint" style="margin:-4px 0 8px">Pendentes perto da sua última inspeção (${esc(e0.codigo)}).</p><div class="list">${pend.map(e => Comp.linhaEq(e)).join('')}</div></div>`;
  }
  const rec = Store.s.ui.recentes.slice(0, 6);
  const ex = ['co2 tarugos','porão tl2','hid 45','lava olhos','almoxarifado','ACI-014','carreta'];
  return `<div class="sugg" style="margin-top:14px">
    ${area}
    ${rec.length ? `<div class="card"><h3>Buscas recentes</h3><div class="chips">${rec.map(r => `<button class="chip" data-action="busca-exemplo" data-q="${esc(r)}">${ico('history')}${esc(r)}</button>`).join('')}</div></div>` : ''}
    <div class="card"><h3>Experimente buscar por</h3><div class="chips">${ex.map(r => `<button class="chip" data-action="busca-exemplo" data-q="${esc(r)}">${esc(r)}</button>`).join('')}</div>
    <p class="hint" style="margin:10px 0 0">A busca ignora acentos e maiúsculas e combina palavras: “co2 tarugos” encontra os extintores de CO₂ no pátio de tarugos. Também acha pelo nº do cilindro e pelo nome do bombeiro. Funciona sem internet.</p></div>
  </div>`;
};

/* ---------- NOVA INSPEÇÃO (mesma sequência do Forms: gerência → tipo → equipamento) ---------- */
V.nova = (q) => {
  if (!Regras.pode('inspecionar')) return Comp.vazio('shield', 'Somente inspetores registram inspeções', 'Seu perfil é de consulta.');
  const ger = q.get('ger') || '', cat = q.get('cat') || '', todos = q.get('todos') === '1', filtro = q.get('f') || '';
  const pend = (g, c) => Store.s.equipamentos.filter(e => e.ativo && (!g || e.ger === g) && (!c || e.cat === c) && Regras.noMeuFiltro(e) && Regras.situacao(e).pendente).length;
  const g = ger && Store.ger(ger);
  const steps = `<nav class="steps" aria-label="Etapas">
    <a class="step ${!ger ? 'on' : 'done'}" href="#/nova"><b>1</b>${ger ? esc(g.sigla) : 'Gerência'}</a>
    <a class="step ${ger && !cat ? 'on' : cat ? 'done' : ''}" href="${ger ? `#/nova?ger=${ger}` : '#/nova'}"><b>2</b>${cat ? CAT[cat].plural : 'Tipo'}</a>
    <span class="step ${cat ? 'on' : ''}"><b>3</b>Equipamento</span>
    <span class="step"><b>4</b>Checklist</span></nav>`;
  const rota = Regras.meusAtivo() ? `<p class="hint" style="margin:-4px 2px 12px">Extintores: mostrando os seus pontos · <button class="linkbtn" data-action="meus" data-v="0" style="padding:0">ver toda a equipe</button></p>` : '';
  const cta = `<button type="button" class="scan-cta" data-action="scan-abrir"><span class="ic">${ico('scan')}</span><span><b>Ler QR Code</b><span>Na frente do equipamento? Leia a etiqueta e vá direto ao checklist</span></span>${ico('chev')}</button>`;
  if (!ger) {
    const gs = Store.s.gerencias.filter(x => Store.s.equipamentos.some(e => e.ger === x.id));
    return steps + cta + rota + `<div class="pick-grid">${gs.map(x => { const n = pend(x.id, ''); return `<a class="pick" href="#/nova?ger=${x.id}"><b>${esc(x.nome)}</b><span class="n ${n ? '' : 'zero'}">${n || ico('check')}</span><span>${n ? (n === 1 ? 'pendente' : 'pendentes') : 'em dia'}</span></a>`; }).join('')}</div>`;
  }
  if (!cat) {
    return steps + rota + `<div class="pick-grid">${CATEGORIAS.map(c => { const tot = Store.s.equipamentos.filter(e => e.ativo && e.ger === ger && e.cat === c.id).length; if (!tot) return ''; const n = pend(ger, c.id); return `<a class="pick" href="#/nova?ger=${ger}&cat=${c.id}"><span class="ic">${ico(c.icone)}</span><b>${c.plural}</b><span><b class="n ${n ? '' : 'zero'}" style="font-size:18px">${n}</b> pendentes de ${tot}</span></a>`; }).join('')}</div>`;
  }
  const termos = Busca.termos(filtro);
  const lista = Store.s.equipamentos.filter(e => e.ativo && e.ger === ger && e.cat === cat && Regras.noMeuFiltro(e))
    .map(e => ({ e, s: Regras.situacao(e) })).filter(x => todos || x.s.pendente)
    .filter(x => !termos.length || termos.every(t => Util.norm(Regras.textoBusca(x.e)).includes(t)))
    .sort((a, b) => (b.s.pendente - a.s.pendente) || a.e.area.localeCompare(b.e.area) || a.e.codigo.localeCompare(b.e.codigo, 'pt', { numeric: true }));
  return steps + rota + `
  <div class="search-box" style="margin-bottom:10px">${ico('search')}<label class="sr" for="nova-f">Filtrar</label><input class="input" id="nova-f" type="search" data-input="nova-f" value="${esc(filtro)}" placeholder="Filtrar por nº, local, tipo…" autocomplete="off"></div>
  <div class="chips" style="margin-bottom:10px"><button class="chip" data-action="nova-todos" aria-pressed="${todos}">Mostrar também os já inspecionados</button></div>
  <div id="nova-list">${lista.length ? `<div class="list">${lista.slice(0, 200).map(x => Comp.linhaEq(x.e, { termos, href: `#/inspecao/${x.e.id}?de=lista` })).join('')}</div>` : Comp.vazio('check', 'Nada pendente aqui', `Todos os ${CAT[cat].plural.toLowerCase()} de ${esc(g.nome)} foram inspecionados neste ciclo.`)}</div>`;
};

/* ---------- INSPEÇÃO ---------- */
const Form = {
  novo(e) {
    const d = e.dados, ult = Store.inspecoesDe(e.id).find(i => !i.anulada && i.ck && i.ck.op);
    return { eq: e.id, it: padroesItens(e), desc: {}, troca: null, motivo: '', obs: '', fotos: [],
      cab: { fab: e.fab, agente: d.agente || '', n2: d.n2 || '', n3: d.n3 || '', thUlt: d.thUlt || '', thProx: d.thProx || '', kitVenc: d.kitVenc || '' },
      op: { anel: (ult && ult.ck.op.anel) || d.anel || '', base: (ult && ult.ck.op.base) || d.base || '' }, gatilho: 'Não',
      qtd: { ...(d.qtd || {}) }, qtdRef: { ...(d.qtd || {}) }, press: !!d.press };
  },
  itens(e, f) { return itensDe(e, f.press); },
  pendencias(e, f) {
    const faltam = [], semDesc = [];
    for (const it of Form.itens(e, f)) { if (!f.it[it.k]) faltam.push(it.l); else if (f.it[it.k] === 'NC' && (f.desc[it.k] || '').trim().length < 3) semDesc.push(it.l); }
    const m = [];
    if (faltam.length) m.push(`Responda: ${faltam.join(', ')}.`);
    if (semDesc.length) m.push(`Descreva a não conformidade em: ${semDesc.join(', ')}.`);
    if (e.cat === 'extintor') {
      if (!f.op.anel) m.push('Escolha a cor do anel.');
      if (!f.op.base) m.push('Escolha a base.');
      if (!f.troca) m.push('Informe se haverá troca do extintor.');
      else if (f.troca === 'Sim' && !f.motivo) m.push('Escolha o motivo da troca.');
    }
    const regra = Store.s.cfg.foto;
    const temNC = Object.values(f.it).includes('NC') || f.troca === 'Sim';
    if (!f.fotos.length && (regra === 'todas' || (regra === 'nc' && temNC))) m.push(regra === 'todas' ? 'Adicione ao menos 1 foto do equipamento (obrigatório, como no Forms atual).' : 'Adicione ao menos 1 foto da não conformidade.');
    return m;
  },
  respondidos(e, f) { const its = Form.itens(e, f); return [its.filter(i => f.it[i.k]).length, its.length]; }
};
V.inspecao = (id, q) => {
  const e = Store.eq(id); if (!e) return V.naoEncontrado();
  if (!Regras.pode('inspecionar')) { location.hash = `#/ficha/${id}`; return ''; }
  const s = Regras.situacao(e), g = Store.ger(e.ger);
  const f = Store._form?.eq === id ? Store._form : (Store._form = Form.novo(e));
  f.origem = q && q.get('de') || f.origem || 'busca';
  const ult = s.ultima, n2 = Regras.n2(e), agora = new Date();
  return `
  <section class="card eq-head">
    <div class="top-line"><span class="code">${esc(e.codigo)}</span><span class="tag t-info">${ico(CAT[e.cat].icone)}${esc(CAT[e.cat].nome)}</span>${Comp.tagSituacao(e, s)}</div>
    <div class="desc">${esc(e.subtipo)}${e.resp ? ` · ponto de ${esc(Store.usuario(e.resp).nome)}` : ''}</div>
    <dl class="kv"><dt>Local</dt><dd>${esc(e.local)}</dd><dt>Última</dt><dd>${ult ? `${Util.fmtCurta(ult.dt)} · ${ult.st === 'ok' ? 'Conforme' : 'Não conforme'} · ${esc(Store.usuario(ult.ins).nome)}` : 'Nenhuma inspeção registrada'}</dd></dl>
    ${!s.pendente ? `<div class="notice n-amber">${ico('info')}<div>Já inspecionado neste ciclo em <b>${Util.fmtCurta(s.noCiclo[0].dt)}</b> por <b>${esc(Store.usuario(s.noCiclo[0].ins).nome)}</b>. Uma nova inspeção (ex.: após correção) fica registrada junto no histórico.</div></div>` : ''}
    ${s.ncAberta ? `<div class="notice n-red">${ico('alert')}<div>Não conformidade aberta: <b>${esc(Regras.textoNC(ult))}</b>. Uma inspeção toda conforme encerra a NC.</div></div>` : ''}
    ${n2 && n2.st === 'vencida' ? `<div class="notice n-red">${ico('clock')}<div>Recarga (N2) <b>vencida em ${n2.rot}</b> segundo o cadastro. Se a etiqueta confirmar, marque a troca por “Validade da Carga N2”. <button class="linkbtn" data-action="aplicar-n2" style="padding:0;display:block">Marcar troca por validade N2</button></div></div>` : ''}
    ${e.dados.obsOrigem ? `<div class="notice n-info">${ico('file')}<div>Observação da planilha: <b>${esc(e.dados.obsOrigem)}</b></div></div>` : ''}
    ${e.dados.conferir ? `<div class="notice n-amber">${ico('alert')}<div>Cadastro marcado como <b>“requer conferência”</b> na planilha. Confira os dados abaixo com a etiqueta.</div></div>` : ''}
  </section>
  <section class="fsec card pad">
    <h3 style="margin:0 0 10px">Identificação <span class="hint">preenchida automaticamente</span></h3>
    <div class="auto">
      <div><span>Data da inspeção</span><b>${Util.fmtDataHora(agora)}</b></div>
      <div><span>Bombeiro responsável</span><b>${esc(Store.eu.nome)}</b></div>
      <div><span>Gerência</span><b>${esc(g.nome)}</b></div>
      <div><span>Tipo de equipamento</span><b>${esc(CAT[e.cat].nome)}</b></div>
      <div><span>Nº do ${e.cat === 'extintor' ? 'ponto' : CAT[e.cat].nome.toLowerCase().split(' ')[0]}</span><b>${esc(e.codigo)}${e.dados.numOrigem ? ` (nº ${esc(e.dados.numOrigem)})` : ''}</b></div>
      <div><span>Local / referência</span><b>${esc(e.local)}</b></div>
    </div>
    <div class="auto-note">${ico('check')}6 campos que no Forms eram digitados a cada inspeção</div>
  </section>
  <form id="form-insp" novalidate><div id="insp-corpo">${V.inspCorpo(e, f)}</div>
    <div class="err" id="insp-err" role="alert"></div>
    <div class="save-bar"><button type="submit" class="btn btn-pri btn-block" id="btn-salvar">${ico('check')}Salvar inspeção${Store.s.offline ? ' (offline)' : ''}</button></div>
  </form>`;
};
V.inspCorpo = (e, f) => {
  const ck = CK[e.cat], [resp, tot] = Form.respondidos(e, f);
  const campo = c => {
    const v = f.cab[c.k] || '', id = `cab-${c.k}`;
    const ctl = c.t === 'select' ? `<select class="select" id="${id}" data-input="cab" data-k="${c.k}">${c.op.map(o => `<option ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`
      : `<input class="input" id="${id}" data-input="cab" data-k="${c.k}" type="${c.t === 'year' ? 'number' : c.t}" ${c.t === 'year' ? 'min="2000" max="2099" inputmode="numeric"' : ''} value="${esc(v)}">`;
    return `<label class="field"><span>${esc(c.l)}</span>${ctl}</label>`;
  };
  const seg = (k, v, ops, acao = 'ck', cls = '') => `<div class="seg ${cls}" role="radiogroup">${ops.map(o => `<button type="button" data-action="${acao}" data-k="${k}" data-v="${o}" role="radio" aria-pressed="${v === o}" aria-checked="${v === o}">${o}</button>`).join('')}</div>`;
  const item = it => {
    const v = f.it[it.k];
    return `<div class="ck-item"><div class="ck-top"><span class="ck-l">${esc(it.l)}${it.k === 'manometro' && e.ag === 'CO2' ? '<small>CO₂ não tem manômetro — NA já marcado</small>' : ''}</span>${seg(it.k, v, it.na ? ['C','NC','NA'] : ['C','NC'])}</div>
      ${v === 'NC' ? `<div class="ck-nc"><div class="chips">${it.sug.map(t => `<button type="button" class="chip" data-action="ck-sug" data-k="${it.k}" data-t="${esc(t)}" aria-pressed="${(f.desc[it.k] || '') === t}">${esc(t)}</button>`).join('')}</div>
        <label class="sr" for="d-${it.k}">Descrever NC em ${esc(it.l)}</label><input class="input" id="d-${it.k}" data-input="ck-desc" data-k="${it.k}" value="${esc(f.desc[it.k] || '')}" placeholder="Descrever NC — ${esc(it.l)}" maxlength="200"></div>` : ''}</div>`;
  };
  let h = '';
  if (ck.cab) h += `<section class="fsec card pad"><h3 style="margin:0 0 4px">Dados do equipamento <span class="hint">confira com a etiqueta</span></h3><p class="hint" style="margin:0 0 10px">Já vêm do cadastro. Se algo mudou (ex.: recarga nova), corrija aqui — o cadastro é atualizado ao salvar.</p><div class="cab">${ck.cab.map(campo).join('')}</div></section>`;
  if (e.cat === 'chuveiro') h += `<section class="fsec card pad"><div class="ck-top"><span class="ck-l">Equipamento pressurizado?</span>${seg('press', f.press ? 'Sim' : 'Não', ['Sim','Não'], 'ck-press', 'neutral')}</div></section>`;
  h += `<section class="fsec"><h3>Checklist <button type="button" class="btn btn-sec btn-sm" data-action="ck-tudo">${ico('check')}Tudo conforme</button></h3>
    <div class="progress-ck"><div class="bar"><i style="width:${Util.pct(resp, tot)}%"></i></div><span class="hint">${resp} de ${tot}</span></div>
    <div class="card" style="padding:2px 14px">${Form.itens(e, f).map(item).join('')}</div></section>`;
  if (ck.opcoes) h += `<section class="fsec card pad">${ck.opcoes.map(o => `<div class="lbl" style="margin-top:4px"><span>${esc(o.l)}</span></div><div class="chips" style="margin-bottom:8px">${o.op.map(v => `<button type="button" class="chip" data-action="ck-op" data-k="${o.k}" data-v="${esc(v)}" aria-pressed="${f.op[o.k] === v}">${esc(v)}</button>`).join('')}</div>`).join('')}</section>`;
  if (ck.qtd) h += `<section class="fsec card pad"><h3 style="margin:0 0 4px">Materiais do abrigo</h3>${ck.qtd.map(q => { const v = f.qtd[q.k] ?? 0, ref = f.qtdRef[q.k] ?? 0; return `<div class="qtd-row"><span><b>${esc(q.l)}</b>${v < ref ? `<span class="hint" style="color:var(--red)">Havia ${ref} na última inspeção</span>` : `<span class="hint">Última inspeção: ${ref}</span>`}</span><span class="stepper"><button type="button" data-action="qtd" data-k="${q.k}" data-d="-1" aria-label="Diminuir ${esc(q.l)}">−</button><output>${v}</output><button type="button" data-action="qtd" data-k="${q.k}" data-d="1" aria-label="Aumentar ${esc(q.l)}">+</button></span></div>`; }).join('')}</section>`;
  if (e.cat === 'extintor') h += `<section class="fsec card pad"><div class="ck-l" style="margin-bottom:8px">Algum gatilho de atendimento identificado? <small>Fluxo 2 — abre um atendimento de reposição ao salvar</small></div><div class="chips">${['Não', ...Object.values(GATILHOS).map(g => g.nome)].map(v => `<button type="button" class="chip" data-action="ck-gat" data-v="${v}" aria-pressed="${f.gatilho === v}">${v}</button>`).join('')}</div></section>`;
  if (ck.troca) h += `<section class="fsec card pad"><div class="ck-top"><span class="ck-l">${ck.troca.l}</span>${seg('troca', f.troca, ['Não','Sim'], 'ck-troca')}</div>
    ${f.troca === 'Sim' ? `<div class="lbl"><span>Qual o motivo?</span></div><div class="chips">${ck.troca.motivos.map(m => `<button type="button" class="chip" data-action="ck-motivo" data-v="${esc(m)}" aria-pressed="${f.motivo === m}">${esc(m)}</button>`).join('')}</div>` : ''}</section>`;
  const regra = Store.s.cfg.foto;
  h += `<section class="fsec card pad"><label class="lbl" for="insp-obs" style="margin-top:0"><span>Observação</span><span class="hint" style="font-weight:500">opcional</span></label>
    <textarea class="textarea" id="insp-obs" data-input="insp-obs" maxlength="1000" placeholder="Algo mais a registrar?">${esc(f.obs)}</textarea>
    <div class="lbl"><span>Evidências fotográficas <span class="hint" style="font-weight:500">(até 3)</span></span>${regra === 'todas' ? '<span class="req">obrigatória</span>' : regra === 'nc' ? '<span class="hint">obrigatória se houver NC</span>' : ''}</div>
    <div class="thumbs" id="thumbs">${V.thumbs(f)}</div></section>`;
  return h;
};
V.thumbs = f => f.fotos.map((src, i) => `<div class="thumb"><img src="${src}" alt="Foto ${i + 1} da inspeção"><button type="button" data-action="foto-del" data-i="${i}" aria-label="Remover foto ${i + 1}">${ico('x')}</button></div>`).join('')
  + (f.fotos.length < 3 ? `<label class="addphoto">${ico('camera')}Tirar foto<input type="file" accept="image/*" capture="environment" data-input="foto" class="sr"></label><button type="button" class="addphoto" data-action="foto-exemplo">${ico('plus')}Foto de exemplo</button>` : '');

/* ---------- FICHA DO EQUIPAMENTO ---------- */
V.ficha = (id) => {
  const e = Store.eq(id); if (!e) return V.naoEncontrado();
  const s = Regras.situacao(e), g = Store.ger(e.ger), ins = Store.inspecoesDe(id);
  const dd = e.dados, fd = v => v ? Util.fmtData(v + 'T12:00') : '—', n2 = Regras.n2(e);
  const campos = [['Categoria', CAT[e.cat].nome], ['Tipo', e.subtipo], ['Gerência', g.nome], ['Área', e.area], ['Local', e.sub || e.area], ['Bombeiro responsável', e.resp ? Store.usuario(e.resp).nome : 'Equipe (sem responsável fixo)'], ['Periodicidade', CAT[e.cat].per === 'mensal' ? 'Mensal' : 'Semanal']];
  if (e.cat === 'extintor') campos.push(['Agente extintor', dd.agente], ['Nº do cilindro', e.fab || '—'], ['Inspeção N2 (recarga)', n2 ? n2.rot + (n2.st === 'vencida' ? ' — vencida' : '') : '—'], ['Inspeção N3 (teste hidrostático)', dd.n3 || '—'], ['Cor do anel', dd.anel || '—'], ['Base', dd.base || '—']);
  if (e.cat === 'hidrante') campos.push(['Último teste hidrostático', fd(dd.thUlt)], ['Próximo teste hidrostático', fd(dd.thProx)], ['Materiais do abrigo', dd.qtd ? `${dd.qtd.mangueiras} mangueiras · ${dd.qtd.storz} chave Storz · ${dd.qtd.agulheta} agulheta · ${dd.qtd.regulavel} regulável` : '—']);
  if (e.cat === 'maca') campos.push(['Vencimento do kit', fd(dd.kitVenc)]);
  if (e.cat === 'chuveiro') campos.push(['Pressurizado', dd.press ? 'Sim' : 'Não']);
  if (e.dados.numOrigem) campos.push(['Nº na planilha', e.dados.numOrigem]);
  if (!e.ativo) campos.push(['Inativado em', `${Util.fmtData(e.inativadoEm)} — ${e.motivoInativacao}`]);
  const comp = [];
  if (e.dados.obsOrigem) comp.push(['Observação da planilha', e.dados.obsOrigem]);
  if (e.dados.conferir) comp.push(['Requer conferência', 'Sim (marcado na planilha)']);
  comp.push(['Origem', `${e.dados.aba || {extintor:'CadastroExtintores',hidrante:'CadastroHidrante',maca:'CadastroMacas',chuveiro:'CadastroChuveiros'}[e.cat]} · linha ${e.dados.linha}`]);
  return `
  <section class="card eq-head">
    <div class="top-line"><span class="code">${esc(e.codigo)}</span>${Comp.tagSituacao(e, s)}</div>

V.historicoFiltrado = () => {

    <div class="kpi"><div class="l">Taxa de não conformidade</div><div class="v">${R.taxaNc}%</div><div class="s">${R.nc} NC no ciclo</div></div>
    <div class="kpi"><div class="l">NCs abertas agora</div><div class="v" style="color:var(--red)">${Regras.ncsAbertas().filter(x => !ger || x.e.ger === ger).length}</div><div class="s">todas as categorias</div></div>
  </div>
  <div class="grid-2" style="margin-top:12px">

    <section class="card chart"><h3>Conformidade por categoria</h3><p class="sub">% inspecionado no ciclo (chuveiros: semana atual)</p>${hbars(R.porCat)}</section>
    <section class="card chart"><h3>Inspeções por bombeiro no ciclo</h3><p class="sub">Quantidade registrada por cada bombeiro (todas as categorias)</p>${(() => { const l = Relatorio.inspecoesCiclo(per, ger).concat(Store.s.inspecoes.filter(i => !i.anulada && i.per === 'semanal' && i.dt.slice(0, 7) === per && (!ger || Store.eq(i.eq)?.ger === ger))); const cont = BOMBEIROS.map(b => ({ nome: b.nome, n: l.filter(i => i.ins === b.id).length })).filter(x => x.n).sort((a, b) => b.n - a.n); const max = Math.max(1, ...cont.map(x => x.n)); return `<div class="hbars">${cont.map(x => `<div class="hbar" data-tip="<b>${esc(x.nome)}</b>${x.n} inspeções no ciclo"><span class="n">${esc(x.nome)}</span><span class="track"><span class="fill" style="width:${Math.round(x.n * 100 / max)}%;background:var(--navy)"></span></span><span class="v">${x.n}</span></div>`).join('') || '<p class="hint">Sem inspeções no ciclo.</p>'}</div>`; })()}</section>

  </details>`;

const Relatorio = {
  calcular(ciclo, ger) {
    const mens = Store.s.equipamentos.filter(e => e.ativo && CAT[e.cat].per === 'mensal' && (!ger || e.ger === ger));
    const status = e => { const v = Store.inspecoesDe(e.id).filter(i => !i.anulada && i.ciclo === ciclo); return v.length ? v[0].st : null; };
    const agg = lista => { let feitos = 0, nc = 0; for (const e of lista) { const s = status(e); if (s) feitos++; if (s === 'nc') nc++; } return { total: lista.length, feitos, nc, p: Util.pct(feitos, lista.length) }; };
    const tot = agg(mens);
    const porGer = Store.s.gerencias.filter(g => !ger || g.id === ger).map(g => ({ nome: g.nome, ...agg(mens.filter(e => e.ger === g.id)) }));
    const cs = Ciclos.semanal(new Date());
    const porCat = CATEGORIAS.map(c => {
      const l = Store.s.equipamentos.filter(e => e.ativo && e.cat === c.id && (!ger || e.ger === ger));
      if (c.per === 'semanal') { let feitos = 0, nc = 0; for (const e of l) { const v = Store.inspecoesDe(e.id).filter(i => !i.anulada && i.ciclo === cs); if (v.length) { feitos++; if (v[0].st === 'nc') nc++; } } return { nome: c.plural, total: l.length, feitos, nc, p: Util.pct(feitos, l.length) }; }
      return { nome: c.plural, ...agg(l) };
    });
    return { ...tot, conf: tot.p, taxaNc: tot.feitos ? Math.round(tot.nc * 1000 / tot.feitos) / 10 : 0, porGer, porCat };
  },
  inspecoesCiclo(ciclo, ger) {
    return Store.s.inspecoes.filter(i => i.ciclo === ciclo && !i.anulada && (!ger || Store.eq(i.eq)?.ger === ger)).sort((a, b) => a.dt.localeCompare(b.dt));
  }
};

    if (nome.length < 3) return err.textContent = 'Informe o nome completo.';

    const g = k => document.getElementById(k).value.trim(), err = document.getElementById('eq-err');

    if (!/^[A-Z0-9]{2,5}-\d{3,4}$/.test(dados.codigo)) return err.textContent = 'Código no formato SIGLA-000 (ex.: ACI-169).';
    if (Store.s.equipamentos.some(e => e.codigo === dados.codigo && e.id !== id)) return err.textContent = 'Já existe um equipamento com este código.';

};

V.etqLista = f => {
  let l = Store.s.equipamentos.filter(e => e.ativo && (!f.ger || e.ger === f.ger) && (!f.cat || e.cat === f.cat));

  if (f.esc === 'adm') { const a = Store._adm || {}, t = Busca.termos(a.q || ''); l = l.filter(e => (!a.cat || e.cat === a.cat) && t.every(x => Util.norm(Regras.textoBusca(e)).includes(x))); }
  return l.sort((a, b) => Store.ger(a.ger).sigla.localeCompare(Store.ger(b.ger).sigla) || a.area.localeCompare(b.area) || a.codigo.localeCompare(b.codigo, 'pt', { numeric: true }));
};

    rodape:'<button class="btn btn-sec" data-action="fechar-dlg">Fechar</button><button class="btn btn-pri" data-action="imprimir">Imprimir / salvar PDF</button>' });

/* =====================================================================
   GRÁFICOS — HTML/SVG com estilos inline (os mesmos são usados nos
   relatórios exportados). Conforme/Não conforme sempre com legenda.
   ===================================================================== */
const COR = { c:'#1E9E6A', nc:'#D14343', navy:'#0A2F57', teal:'#00A87E', cinza:'#CBD5DF', amber:'#D9912B', azul:'#2F6FD6' };
const Charts = {
  legenda: itens => `<div style="display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:#44576A">${itens.map(([n, c]) => `<span style="display:inline-flex;align-items:center;gap:6px"><i style="width:10px;height:10px;border-radius:3px;background:${c};display:inline-block"></i>${esc(n)}</span>`).join('')}</div>`,
  vazio: (t = 'Sem dados para os filtros escolhidos.') => `<p style="color:#6B7C8D;font-size:13px;margin:8px 0">${t}</p>`,
  /* barras horizontais (empilhadas quando houver mais de um valor) */
  hbars(rows, { cores = [COR.c, COR.nc], nomes = ['Conforme', 'Não conforme'], rot = 150, max, legenda = true, sufixo = '' } = {}) {
    if (!rows.length) return Charts.vazio();
    const m = max || Math.max(1, ...rows.map(r => r.v.reduce((a, b) => a + b, 0)));
    return `<div style="display:grid;gap:7px">${rows.map(r => { const tot = r.v.reduce((a, b) => a + b, 0); const tip = `<b>${esc(r.label)}</b>${r.v.map((x, i) => `${nomes[i] || ''}: ${x}${sufixo}`).join('<br>')}`;
      return `<div data-tip="${esc(tip)}" style="display:grid;grid-template-columns:${rot}px 1fr 48px;align-items:center;gap:8px;font-size:12.5px"><span style="color:#44576A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${esc(r.label)}">${esc(r.label)}</span><span style="display:flex;height:13px;background:#EDF1F5;border-radius:3px;overflow:hidden">${r.v.map((x, i) => x ? `<span style="width:${x * 100 / m}%;background:${cores[i]};${i ? 'border-left:2px solid #fff;' : ''}"></span>` : '').join('')}</span><span style="text-align:right;font-weight:700;color:#16222E;font-variant-numeric:tabular-nums">${tot}${sufixo}</span></div>`; }).join('')}</div>${legenda && rows[0].v.length > 1 ? Charts.legenda(nomes.map((n, i) => [n, cores[i]])) : ''}`;
  },
  /* colunas verticais empilhadas */
  vbars(rows, { cores = [COR.c, COR.nc], nomes = ['Conforme', 'Não conforme'], altura = 150, legenda = true, destaque = -1 } = {}) {
    if (!rows.length) return Charts.vazio();
    const m = Math.max(1, ...rows.map(r => r.v.reduce((a, b) => a + b, 0))), n = rows.length, gap = n > 20 ? 2 : n > 12 ? 4 : 6, passo = Math.ceil(n / 12), num = n <= 16;
    return `<div style="display:flex;align-items:flex-end;gap:${gap}px;height:${altura + 18}px;border-bottom:1px solid #DCE4EC;padding:0 2px">${rows.map((r, k) => { const tot = r.v.reduce((a, b) => a + b, 0); const tip = `<b>${esc(r.label)}</b>${r.v.map((x, i) => `${nomes[i] || ''}: ${x}`).join('<br>')}`;
      return `<div data-tip="${esc(tip)}" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0"><span style="font-size:${num ? 11 : 9}px;font-weight:700;color:#16222E;margin-bottom:3px;white-space:nowrap">${num || tot === m ? tot || '' : ''}</span><span style="width:100%;max-width:44px;display:flex;flex-direction:column-reverse;border-radius:4px 4px 0 0;overflow:hidden;${k === destaque ? 'outline:2px solid #0A2F57;outline-offset:1px;' : ''}">${r.v.map((x, i) => x ? `<span style="height:${x * altura / m}px;background:${cores[i]};${i ? 'border-bottom:2px solid #fff;' : ''}"></span>` : '').join('')}</span></div>`; }).join('')}</div>
      <div style="display:flex;gap:${gap}px;padding:5px 2px 0">${rows.map((r, k) => `<span style="flex:1;min-width:0;text-align:center;font-size:10.5px;color:#6B7C8D;white-space:nowrap;overflow:visible">${k % passo === 0 ? esc(r.label) : ''}</span>`).join('')}</div>${legenda && rows[0].v.length > 1 ? Charts.legenda(nomes.map((n, i) => [n, cores[i]])) : ''}`;
  },
  /* rosca com total no centro */
  donut(parts, { centro, sub = '', tam = 150 } = {}) {
    const tot = parts.reduce((a, p) => a + p.v, 0);
    if (!tot) return Charts.vazio();
    const r = 52, C = 2 * Math.PI * r; let off = 0;
    const arcos = parts.filter(p => p.v).map(p => { const len = p.v / tot * C; const s = `<circle r="${r}" cx="70" cy="70" fill="none" stroke="${p.cor}" stroke-width="20" stroke-dasharray="${Math.max(0, len - 2)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"><title>${esc(p.label)}: ${p.v}</title></circle>`; off += len; return s; }).join('');
    return `<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap"><svg viewBox="0 0 140 140" width="${tam}" height="${tam}" role="img" aria-label="${esc(parts.map(p => p.label + ' ' + p.v).join(', '))}">${arcos}<text x="70" y="68" text-anchor="middle" font-family="Poppins,Arial" font-size="24" font-weight="700" fill="#0B2440">${centro ?? tot}</text><text x="70" y="86" text-anchor="middle" font-family="Arial" font-size="10" fill="#6B7C8D">${esc(sub)}</text></svg>
      <div style="display:grid;gap:6px;font-size:12.5px">${parts.map(p => `<span data-tip="<b>${esc(p.label)}</b>${p.v} (${Util.pct(p.v, tot)}%)" style="display:flex;align-items:center;gap:8px"><i style="width:10px;height:10px;border-radius:3px;background:${p.cor};display:inline-block"></i><span style="color:#44576A">${esc(p.label)}</span><b style="margin-left:auto;padding-left:10px">${p.v}</b><span style="color:#6B7C8D;width:38px;text-align:right">${Util.pct(p.v, tot)}%</span></span>`).join('')}</div></div>`;
  },
  /* velocímetro de conformidade (0–100%) */
  gauge(pct, { rotulo = '', meta = 98, tam = 200 } = {}) {
    const p = Math.max(0, Math.min(100, pct)), a = Math.PI * (1 - p / 100), x = 100 + 80 * Math.cos(a), y = 100 - 80 * Math.sin(a);
    const cor = p >= meta ? COR.c : p >= 85 ? COR.amber : COR.nc;
    const am = Math.PI * (1 - meta / 100), mx = 100 + 80 * Math.cos(am), my = 100 - 80 * Math.sin(am);
    return `<svg viewBox="0 0 200 118" width="${tam}" style="max-width:100%" role="img" aria-label="${esc(rotulo)} ${p}%"><path d="M20 100 A80 80 0 0 1 180 100" fill="none" stroke="#E6ECF2" stroke-width="18" stroke-linecap="round"/>${p > 0 ? `<path d="M20 100 A80 80 0 0 1 ${x.toFixed(1)} ${y.toFixed(1)}" fill="none" stroke="${cor}" stroke-width="18" stroke-linecap="round"/>` : ''}<line x1="${(100 + 68 * Math.cos(am)).toFixed(1)}" y1="${(100 - 68 * Math.sin(am)).toFixed(1)}" x2="${(100 + 92 * Math.cos(am)).toFixed(1)}" y2="${(100 - 92 * Math.sin(am)).toFixed(1)}" stroke="#44576A" stroke-width="2" stroke-dasharray="3 2"/><text x="100" y="92" text-anchor="middle" font-family="Poppins,Arial" font-size="30" font-weight="700" fill="#0B2440">${String(p).replace('.', ',')}%</text><text x="100" y="112" text-anchor="middle" font-family="Arial" font-size="10" fill="#6B7C8D">${esc(rotulo)} · meta ${meta}%</text></svg>`;
  },
  /* matriz itens NC × equipamento (como no BI) */
  heat(linhas, colunas, val) {
    if (!linhas.length) return Charts.vazio('Nenhum item não conforme no período.');
    const max = Math.max(1, ...linhas.flatMap(l => colunas.map(c => val(l, c))));
    return `<div style="overflow-x:auto"><table style="border-collapse:separate;border-spacing:3px;font-size:11.5px;width:100%"><thead><tr><th></th>${colunas.map(c => `<th style="font-weight:600;color:#44576A;padding:2px 4px;text-align:center;writing-mode:vertical-rl;transform:rotate(180deg);height:128px;white-space:nowrap;font-size:11px">${esc(c)}</th>`).join('')}</tr></thead><tbody>${linhas.map(l => `<tr><td style="font-weight:700;color:#0B2440;white-space:nowrap;padding-right:6px">${esc(l)}</td>${colunas.map(c => { const v = val(l, c); return `<td data-tip="<b>${esc(l)}</b>${esc(c)}: ${v} NC" style="background:${v ? `rgba(209,67,67,${.25 + .75 * v / max})` : '#F1F4F7'};color:${v ? '#fff' : '#9AA8B5'};text-align:center;border-radius:4px;height:24px;min-width:26px;font-weight:700">${v || ''}</td>`; }).join('')}</tr>`).join('')}</tbody></table></div>`;
  },
  barra: (p, cor = COR.teal) => `<span style="display:block;height:8px;background:#E6ECF2;border-radius:999px;overflow:hidden"><i style="display:block;height:100%;width:${Math.max(0, Math.min(100, p))}%;background:${cor};border-radius:999px"></i></span>`
};

/* =====================================================================
   QR CODE — cada equipamento tem um identificador próprio e único.
   O QR grava o endereço do Inspec + identificador; lido pela câmera do
   celular abre o equipamento direto no sistema (#/q/<id>). O identificador
   é aleatório (não é o código do equipamento): trocar o código, a gerência
   ou o local não invalida a etiqueta já colada.
   ===================================================================== */
const QR = {
  base: 'HTTPS://INSPEC.RWNITSOLUTIONS.COM.BR/Q/',
  ALF: '23456789ABCDEFGHJKMNPQRSTUVWXYZ',
  usados() { const u = new Set(); for (const e of Store.s.equipamentos) { if (e.qr) u.add(e.qr); (e.qrAntigos || []).forEach(x => u.add(x.t)); } return u; },
  gerarToken(usados, rnd = Math.random) { let t; do { t = Array.from({ length: 8 }, () => QR.ALF[Math.floor(rnd() * QR.ALF.length)]).join(''); } while (usados.has(t)); usados.add(t); return t; },
  /* garante QR em todos os equipamentos (dados antigos ou importados) */
  garantir(s) {
    let seed = 20260930; const rnd = () => ((seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648);
    const u = new Set(s.equipamentos.filter(e => e.qr).map(e => e.qr)); let mudou = false;
    for (const e of s.equipamentos) if (!e.qr) { e.qr = QR.gerarToken(u, rnd); e.qrEm = e.criado; e.qrImpresso = e.dados?.aba === 'Cadastro manual' ? null : e.criado; mudou = true; }
    return mudou;
  },
  url: e => QR.base + e.qr,
  fmt: t => t ? t.slice(0, 4) + '-' + t.slice(4) : '',
  matriz(txt) { const q = qrcode(0, 'M'); q.addData(txt, /^[0-9A-Z $%*+\-./:]*$/.test(txt) ? 'Alphanumeric' : 'Byte'); q.make(); return q; },
  svg(txt, { margem = 2, px } = {}) {
    const q = QR.matriz(txt), n = q.getModuleCount(), t = n + margem * 2; let d = '';
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c + margem} ${r + margem}h1v1h-1z`;
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${t} ${t}" ${px ? `width="${px}" height="${px}"` : ''} shape-rendering="crispEdges" role="img" aria-label="QR Code"><rect width="${t}" height="${t}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
  },
  /* interpreta o conteúdo lido: endereço do Inspec, identificador puro ou código do equipamento */
  resolver(txt) {
    const bruto = String(txt || '').trim(), up = bruto.toUpperCase();
    const m = up.match(/\/Q\/([0-9A-Z]{4}-?[0-9A-Z]{4})\b/) || up.match(/^(?:INSPEC:)?([0-9A-Z]{4}-?[0-9A-Z]{4})$/);
    if (m) { const t = m[1].replace('-', ''); let e = Store.s.equipamentos.find(x => x.qr === t); if (e) return { e }; e = Store.s.equipamentos.find(x => (x.qrAntigos || []).some(a => a.t === t)); if (e) return { e, antigo: e.qrAntigos.find(a => a.t === t) }; }
    const porCod = Store.s.equipamentos.find(x => x.codigo === up);
    if (porCod) return { e: porCod, porCodigo: true };
    return { erro: /^https?:/i.test(bruto) ? 'Este QR Code não é de uma etiqueta do Inspec.' : 'QR Code não reconhecido: não corresponde a nenhum equipamento cadastrado.' };
  },
  etiqueta(e) {
    const g = Store.ger(e.ger);
    return `<div class="etq"><div class="q">${QR.svg(QR.url(e), { margem: 1 })}</div><div class="t"><span class="m"><img src="${SYM}" alt="">INSPEC</span><span class="c">${esc(e.codigo)}</span><span class="s">${esc(CAT[e.cat].nome)} · ${esc(e.subtipo)}${e.cap && !Util.norm(e.subtipo).includes(Util.norm(e.cap)) ? ' ' + esc(e.cap) : ''}</span><span class="l">${esc(g.sigla)} › ${esc(e.local)}</span><span class="id">ID ${QR.fmt(e.qr)}</span></div></div>`;
  },
  MODELOS: {
    a4263: { nome:'Pimaco A4263 / 6180 — 21 por folha (63,5 × 38,1 mm)', col: 3, lin: 7, w: 63.5, h: 38.1, mx: 7.2, my: 15.15, gx: 2.5, gy: 0 },
    a4260: { nome:'Pimaco A4260 — 24 por folha (63,5 × 33,9 mm)', col: 3, lin: 8, w: 63.5, h: 33.9, mx: 7.2, my: 12.9, gx: 2.5, gy: 0 },
    avulsa: { nome:'Impressora de etiquetas — 1 por etiqueta (63,5 × 38,1 mm)', col: 1, lin: 1, w: 63.5, h: 38.1, avulsa: true }
  },
  imprimir(lista, { modelo = 'a4263', pular = 0 } = {}) {
    const M = QR.MODELOS[modelo], porFolha = M.col * M.lin, cels = [...Array(M.avulsa ? 0 : pular).fill(null), ...lista], folhas = [];
    for (let i = 0; i < cels.length; i += porFolha) folhas.push(cels.slice(i, i + porFolha));
    const css = `*{box-sizing:border-box}body{margin:0;background:#E9EEF3;font-family:Inter,Arial,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
      .bar{position:sticky;top:0;z-index:5;background:#0A2F57;color:#fff;display:flex;gap:8px;align-items:center;padding:10px 16px;font-size:13px}.bar b{flex:1}.bar span{color:#C9D6E3;font-size:12px}.bar button{background:#fff;color:#0A2F57;border:0;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer}.bar button.alt{background:rgba(255,255,255,.14);color:#fff}
      .fl{width:210mm;height:297mm;margin:14px auto;background:#fff;box-shadow:0 4px 20px rgba(0,0,0,.12);padding:${M.my || 0}mm ${M.mx || 0}mm;display:grid;grid-template-columns:repeat(${M.col},${M.w}mm);grid-auto-rows:${M.h}mm;column-gap:${M.gx || 0}mm;row-gap:${M.gy || 0}mm;align-content:start;page-break-after:always}
      .fl.av{width:${M.w}mm;height:${M.h}mm;padding:0;display:block}
      ${document.querySelector('style').textContent.match(/\.etq[^{]*\{[^}]*\}/g).join('\n')}
      .etq{border:0;border-radius:0}.vz{border:1px dashed #E1E7EE}
      @page{size:${M.avulsa ? `${M.w}mm ${M.h}mm` : 'A4'};margin:0}
      @media print{body{background:#fff}.bar{display:none}.fl{margin:0;box-shadow:none}.vz{border:0}}`;
    const corpo = M.avulsa ? lista.map(e => `<div class="fl av">${QR.etiqueta(e)}</div>`).join('') : folhas.map(f => `<div class="fl">${f.map(e => e ? QR.etiqueta(e) : '<div class="vz"></div>').join('')}</div>`).join('');
    const doc = `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Etiquetas QR — Inspec</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"><style>${css}</style></head><body>
      <div class="bar"><b>Etiquetas QR · ${Util.plural(lista.length, 'etiqueta')}${M.avulsa ? '' : ` · ${Util.plural(folhas.length, 'folha')}`}</b><span>${esc(M.nome)} · imprima em 100% (sem “ajustar à página”)</span><button onclick="window.print()">Imprimir</button><button class="alt" onclick="window.close()">Fechar</button></div>${corpo}</body></html>`;
    const w = window.open(URL.createObjectURL(new Blob([doc], { type:'text/html' })), '_blank');
    if (!w) return UI.toast('Permita pop-ups para abrir as etiquetas.');
    const agora = new Date().toISOString(); lista.forEach(e => { e.qrImpresso = agora; }); Store.salvar();
  },
  regenerar(e, motivo) {
    (e.qrAntigos || (e.qrAntigos = [])).push({ t: e.qr, ate: new Date().toISOString(), motivo });
    e.qr = QR.gerarToken(QR.usados()); e.qrEm = new Date().toISOString(); e.qrImpresso = null; Store.salvar();
  }
};

/* ---------- LEITOR DE QR CODE (câmera; BarcodeDetector nativo ou jsQR) ---------- */
const Scan = {
  st: null,
  abrir({ modo = 'geral' } = {}) {
    Scan.st = { modo, stream: null, raf: 0, ult: 0, pausa: 0, det: null, demo: false };
    const el = document.getElementById('scan'); el.classList.add('on'); document.body.style.overflow = 'hidden';
    Scan.render(); Scan.camera();
  },
  render(msg = '', tipo = '') {
    const st = Scan.st, el = document.getElementById('scan');
    const exemplos = st.demo ? Scan.exemplos() : [];
    el.innerHTML = `<div class="scan-top"><button class="iconbtn" data-action="scan-fechar" aria-label="Fechar leitor">${ico('x')}</button><b>${st.modo === 'at' ? 'Ler QR do equipamento do atendimento' : 'Ler QR Code do equipamento'}</b>${st.torch ? `<button class="iconbtn" data-action="scan-torch" aria-label="Lanterna">${ico('bolt')}</button>` : ''}</div>
      <div class="scan-view">${st.semCamera ? `<div class="scan-sem">${ico('camera')}<p><b style="color:#fff">${esc(st.semCamera)}</b></p><p>Você pode ler o QR a partir de uma foto, digitar o identificador impresso na etiqueta (ex.: ${QR.fmt(Store.s.equipamentos[0].qr)}) ou, nesta demonstração, simular a leitura.</p></div>` : `<video id="scan-v" playsinline muted></video><div class="scan-mask"><div class="scan-frame"><span class="scan-line"></span></div></div>`}
      <p class="scan-msg ${tipo}" id="scan-msg" role="status">${msg || (st.semCamera ? '' : 'Aponte a câmera para a etiqueta QR do equipamento')}</p></div>
      ${st.demo ? `<div class="scan-demo" aria-label="Etiquetas de exemplo">${exemplos.map(e => `<button type="button" data-action="scan-demo-ler" data-t="${e.qr}">${QR.svg(QR.url(e))}${esc(e.codigo)}</button>`).join('')}</div>` : ''}
      <div class="scan-bot"><button class="btn btn-sm" data-action="scan-foto">${ico('upload')}Ler de uma foto</button><button class="btn btn-sm" data-action="scan-digitar">${ico('edit')}Digitar ID</button><button class="btn btn-sm ${st.demo ? 'btn-pri' : ''}" data-action="scan-demo">${ico('qr')}Simular leitura (demo)</button></div>`;
    if (st.stream) { const v = document.getElementById('scan-v'); v.srcObject = st.stream; v.play().catch(() => {}); }
  },
  exemplos() { const eu = Store.eu, l = Store.s.equipamentos.filter(e => e.ativo); const pend = l.filter(e => Regras.situacao(e).pendente && (!eu || eu.papel !== 'inspetor' || Regras.noMeuFiltro(e))); const out = []; CATEGORIAS.forEach(c => { out.push(...(pend.filter(e => e.cat === c.id).slice(0, 2))); }); return out.slice(0, 8); },
  async camera() {
    const st = Scan.st;
    if (!navigator.mediaDevices?.getUserMedia) { st.semCamera = 'Câmera indisponível neste navegador.'; return Scan.render(); }
    try {
      st.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 } }, audio: false });
      if (!Scan.st) return st.stream.getTracks().forEach(t => t.stop());
      const tr = st.stream.getVideoTracks()[0]; st.torch = !!(tr.getCapabilities && tr.getCapabilities().torch);
      if ('BarcodeDetector' in window) { try { const f = await BarcodeDetector.getSupportedFormats(); if (f.includes('qr_code')) st.det = new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) {} }
      Scan.render(); Scan.loop();
    } catch (err) {
      st.semCamera = err && err.name === 'NotAllowedError' ? 'Permissão da câmera negada. Libere o acesso à câmera nas configurações do navegador.' : 'Nenhuma câmera encontrada neste dispositivo.';
      Scan.render();
    }
  },
  loop() {
    const st = Scan.st; if (!st || !st.stream) return;
    st.raf = requestAnimationFrame(Scan.loop);
    const v = document.getElementById('scan-v'), agora = performance.now();
    if (!v || v.readyState < 2 || agora - st.ult < 140 || agora < st.pausa || st.ocupado) return;
    st.ult = agora;
    if (st.det) { st.ocupado = true; st.det.detect(v).then(r => { st.ocupado = false; if (r[0]) Scan.lido(r[0].rawValue); }).catch(() => { st.ocupado = false; st.det = null; }); return; }
    const txt = Scan.decodificar(v, v.videoWidth, v.videoHeight); if (txt) Scan.lido(txt);
  },
  decodificar(src, w, h, tentar = false) {
    const k = Math.min(1, 800 / Math.max(w, h)), cw = Math.round(w * k), ch = Math.round(h * k);

  lido(txt) {

  },
  /* o que fazer com o equipamento identificado */
  acao({ e, antigo, porCodigo }, modo = 'geral') {
    if (modo === 'at' && Store._at) { Object.assign(Store._at, { eq: e.id, busca: e.codigo, localOk: false, reserva: null }); if (location.hash.startsWith('#/atendimento/novo')) Acoes._reAt(); else location.hash = '#/atendimento/novo'; UI.toast(`${e.codigo} identificado pelo QR Code.`); return; }
    const s = Regras.situacao(e), g = Store.ger(e.ger), podeI = Regras.pode('inspecionar') && e.ativo;

    UI.dialogo({ titulo: `${ico(CAT[e.cat].icone, 'sr-ico')} ${esc(e.codigo)} identificado`, corpo: `
      ${antigo ? `<div class="notice n-amber" style="margin-bottom:12px">${ico('alert')}<div><b>Etiqueta substituída.</b> Esta etiqueta foi invalidada em ${Util.fmtData(antigo.ate)} (${esc(antigo.motivo)}). Retire-a e cole a etiqueta atual — avise a coordenação se ela ainda não foi reimpressa.</div></div>` : ''}
      ${!e.ativo ? `<div class="notice n-amber" style="margin-bottom:12px">${ico('alert')}<div><b>Equipamento inativo</b> desde ${Util.fmtData(e.inativadoEm)} — ${esc(e.motivoInativacao || '')}.</div></div>` : ''}
      ${porCodigo ? '<p class="hint" style="margin-top:0">Identificado pelo código do equipamento.</p>' : ''}
      <div class="list">${Comp.linhaEq(e, { href: `#/ficha/${e.id}` })}</div>
      <p class="hint" style="margin:10px 2px 0">${esc(CAT[e.cat].nome)} · ${esc(g.nome)} · ${s.pendente ? '<b style="color:#8A5A00">pendente no ciclo atual</b>' : 'já inspecionado no ciclo atual'}</p>`,
      rodape: `<button class="btn btn-sec" data-action="scan-abrir">${ico('scan')}Ler outro</button>${Regras.pode('inspecionar') && e.ativo ? `<a class="btn btn-sec" href="#/atendimento/novo?eq=${e.id}">${ico('headset')}Atendimento</a>` : ''}<a class="btn ${podeI ? 'btn-sec' : 'btn-pri'}" href="#/ficha/${e.id}">${ico('file')}Ficha</a>${podeI ? `<a class="btn btn-pri" href="#/inspecao/${e.id}?de=qr">${ico('check')}Inspecionar</a>` : ''}` });
  },
  async foto(file) {
    if (!file) return;
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const txt = Scan.decodificar(img, img.naturalWidth, img.naturalHeight, true); URL.revokeObjectURL(url);
      if (txt) { if (!Scan.st) Scan.st = { modo: 'geral' }; Scan.lido(txt); if (Scan.st && !Scan.st.stream && !document.getElementById('scan').classList.contains('on')) Scan.st = null; }
      else { const m = document.getElementById('scan-msg'); if (m) { m.className = 'scan-msg err'; m.textContent = 'Não encontramos um QR Code nesta foto. Tente mais perto e com boa iluminação.'; } else UI.toast('Nenhum QR Code encontrado na foto.'); } };
    img.src = url;

/* =====================================================================
   PERÍODO — filtro por intervalo de datas (um dia, uma semana, etc.)
   ===================================================================== */
const diaDe = d => { const x = new Date(d); return `${x.getFullYear()}-${Util.pad(x.getMonth() + 1)}-${Util.pad(x.getDate())}`; };
const fmtDia = d => d ? d.split('-').reverse().join('/') : '';
const Periodo = {
  hoje: () => diaDe(new Date()),
  mesAtual() { const h = new Date(); return { de: diaDe(new Date(h.getFullYear(), h.getMonth(), 1)), ate: diaDe(h) }; },
  ok(iso, f) { const d = diaDe(iso); return (!f.de || d >= f.de) && (!f.ate || d <= f.ate) && (!f.mes || d.slice(0, 7) === f.mes); },
  rot(f = {}) {
    if (!f.de && !f.ate) return f.mes ? Ciclos.rotulo(f.mes) : 'Todo o período';
    if (f.de === f.ate) return `Dia ${fmtDia(f.de)}`;
    return `${fmtDia(f.de) || 'início'} a ${fmtDia(f.ate) || 'hoje'}`;
  },
  presets() {
    const h = new Date(), d = n => diaDe(new Date(h.getFullYear(), h.getMonth(), h.getDate() - n));
    return [['Hoje', d(0), d(0)], ['Ontem', d(1), d(1)], ['Últimos 7 dias', d(6), d(0)], ['Últimos 30 dias', d(29), d(0)],
      ['Este mês', diaDe(new Date(h.getFullYear(), h.getMonth(), 1)), d(0)], ['Mês passado', diaDe(new Date(h.getFullYear(), h.getMonth() - 1, 1)), diaDe(new Date(h.getFullYear(), h.getMonth(), 0))],
      ['Últimos 90 dias', d(89), d(0)], ['Todo o período', '', '']];
  },
  inicioDados() { let m = Periodo.hoje(); for (const i of Store.s.inspecoes) { const x = diaDe(i.dt); if (x < m) m = x; } return m; },
  dias(f) { const de = f.de || Periodo.inicioDados(), ate = f.ate || Periodo.hoje(), out = []; let x = new Date(de + 'T12:00'); const fim = new Date(ate + 'T12:00'); while (x <= fim && out.length < 800) { out.push(diaDe(x)); x = new Date(x.getTime() + 864e5); } return out; },
  /* série temporal: por dia até 45 dias; acima disso, por mês */
  serie(f, fn) {
    const ds = Periodo.dias(f);
    if (ds.length <= 45) return { por:'dia', rows: ds.map(d => ({ label: ds.length > 20 ? d.slice(8) : `${d.slice(8)}/${d.slice(5, 7)}`, v: fn({ ...f, mes:'', de: d, ate: d }) })) };
    const ms = [...new Set(ds.map(d => d.slice(0, 7)))];
    return { por:'mês', rows: ms.map(m => ({ label: Ciclos.rotulo(m).replace(/\/\d+$/, '').slice(0, 3) + '/' + m.slice(2, 4), v: fn({ ...f, de: f.de && f.de > m + '-01' ? f.de : m + '-01', ate: f.ate && f.ate < m + '-31' ? f.ate : m + '-31' }) })) };
  }
};
const Cal = {
  alvos: {}, st: null,
  botao(id, per, set, rotulo = 'Período') { Cal.alvos[id] = { per: { de: per.de || '', ate: per.ate || '' }, set }; return `<div class="calwrap"><span class="lb">${rotulo}</span><button type="button" class="calbtn" data-action="cal-open" data-id="${id}" aria-haspopup="dialog">${ico('calendar')}<span>${esc(Periodo.rot(per))}</span>${ico('chevdown')}</button></div>`; },
  abrir(el) {
    const a = Cal.alvos[el.dataset.id]; if (!a) return;
    const base = a.per.ate || a.per.de || Periodo.hoje();
    Cal.st = { id: el.dataset.id, de: a.per.de, ate: a.per.ate, view: base.slice(0, 7), anc: el };
    Cal.render(); const p = document.getElementById('calpop'); p.classList.add('on');
    const r = el.getBoundingClientRect(), w = p.offsetWidth, h = p.offsetHeight;
    p.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + 'px';
    p.style.top = (r.bottom + h + 8 < innerHeight ? r.bottom + 6 : Math.max(8, r.top - h - 6)) + 'px';
    p.querySelector('.cal-grid button:not(:disabled)')?.focus({ preventScroll:true });
  },
  fechar() { const p = document.getElementById('calpop'); p.classList.remove('on'); Cal.st = null; },
  render() {
    const st = Cal.st, [a, m] = st.view.split('-').map(Number), prim = new Date(a, m - 1, 1), hoje = Periodo.hoje();
    const ini = new Date(a, m - 1, 1 - ((prim.getDay() + 6) % 7)), cells = [];
    for (let k = 0; k < 42; k++) { const d = new Date(ini.getFullYear(), ini.getMonth(), ini.getDate() + k), ds = diaDe(d); const fim = st.ate || st.de;
      const cls = [d.getMonth() !== m - 1 ? 'fora' : '', ds === hoje ? 'hoje' : '', st.de && (ds === st.de || ds === st.ate) ? 'ponta' : '', st.de && st.ate && ds > st.de && ds < st.ate ? 'meio' : ''].join(' ');
      cells.push(`<button type="button" class="${cls}" data-action="cal-dia" data-d="${ds}" ${ds > hoje ? 'disabled' : ''} aria-label="${fmtDia(ds)}">${d.getDate()}</button>`); }
    const sel = !st.de ? 'Toque no dia inicial (ou num dia só) e depois no dia final.' : !st.ate ? `Início <b>${fmtDia(st.de)}</b> — toque no dia final ou aplique para ver <b>só este dia</b>.` : `<b>${esc(Periodo.rot(st))}</b> · ${Periodo.dias(st).length} dia(s)`;
    document.getElementById('calpop').innerHTML = `<div class="cal-pre">${Periodo.presets().map(([n, de, ate]) => `<button type="button" data-action="cal-pre" data-de="${de}" data-ate="${ate}" aria-pressed="${st.de === de && (st.ate || st.de) === ate}">${n}</button>`).join('')}</div>
      <div class="cal-main"><div class="cal-nav"><button type="button" class="iconbtn" data-action="cal-mes" data-d="-1" aria-label="Mês anterior">${ico('back')}</button><b>${MESES[m - 1]} ${a}</b><button type="button" class="iconbtn" data-action="cal-mes" data-d="1" aria-label="Próximo mês" ${st.view >= hoje.slice(0, 7) ? 'disabled' : ''}>${ico('chev')}</button></div>
      <div class="cal-grid">${['seg','ter','qua','qui','sex','sáb','dom'].map(x => `<span class="dw">${x}</span>`).join('')}${cells.join('')}</div>
      <p class="cal-sel">${sel}</p><div class="cal-f"><button type="button" class="btn btn-sec btn-sm" data-action="cal-fechar">Cancelar</button><button type="button" class="btn btn-sec btn-sm" data-action="cal-limpar">Todo o período</button><button type="button" class="btn btn-pri btn-sm" data-action="cal-aplicar">Aplicar</button></div></div>`;
  },
  aplicar(de, ate) { const a = Cal.alvos[Cal.st.id]; Cal.fechar(); a.set(de, ate); }
};

/* =====================================================================
   DADOS FILTRADOS (base comum do painel, dos inícios e dos relatórios)
   ===================================================================== */
const mesDe = d => Ciclos.mensal(new Date(d));
const Dados = {
  meses() { const out = [], a = new Date(); for (let k = 0; k < 3; k++) out.push(Ciclos.mensal(new Date(a.getFullYear(), a.getMonth() - k, 15))); return out; },
  eqOk: (e, f) => e && (!f.ger || e.ger === f.ger) && (!f.cat || e.cat === f.cat),
  insp(f = {}) { return Store.s.inspecoes.filter(i => !i.anulada && Periodo.ok(i.dt, f) && (!f.bomb || i.ins === f.bomb) && Dados.eqOk(Store.eq(i.eq), f)); },
  at(f = {}) { return (Store.s.atendimentos || []).filter(a => Periodo.ok(a.dtAcion, f) && (!f.bomb || a.bombeiro === f.bomb) && Dados.eqOk(Store.eq(a.eq), f)); },
  resp: a => a.origem === 'producao' ? Math.max(0, Math.round((new Date(a.dtChegada) - new Date(a.dtAcion)) / 60e3)) : null,
  mediaResp(ats) { const l = ats.map(Dados.resp).filter(x => x != null); return l.length ? Math.round(l.reduce((a, b) => a + b, 0) / l.length) : 0; },
  cn: l => [l.filter(i => i.st === 'ok').length, l.filter(i => i.st === 'nc').length],
  agrupar(l, chave) { const m = new Map(); for (const x of l) { const k = chave(x); if (k == null) continue; if (!m.has(k)) m.set(k, []); m.get(k).push(x); } return m; },
  itensNC(insps) {
    const cont = new Map(), porEq = new Map();
    for (const i of insps) { if (i.st !== 'nc') continue; const e = Store.eq(i.eq); const ck = i.ck || {}; const labels = [];
      for (const it of itensDe(e, ck.press ?? e.dados.press)) if (ck.it && ck.it[it.k] === 'NC') labels.push(it.l);
      if (ck.troca === 'Sim') labels.push('Troca do extintor'); if (ck.gatilho && ck.gatilho !== 'Não') labels.push('Gatilho: ' + ck.gatilho);
      if (!labels.length && /Troca/.test(i.resumo || '')) labels.push('Troca do extintor');
      for (const l of labels) { cont.set(l, (cont.get(l) || 0) + 1); if (!porEq.has(e.codigo)) porEq.set(e.codigo, new Map()); const m = porEq.get(e.codigo); m.set(l, (m.get(l) || 0) + 1); } }
    return { cont, porEq };
  },
  cobertura(f = {}) { const l = Store.s.equipamentos.filter(e => e.ativo && Dados.eqOk(e, f) && (!f.bomb || e.resp === f.bomb)); const p = l.filter(e => Regras.situacao(e).pendente).length; return { total: l.length, feitos: l.length - p, pend: p, pct: Util.pct(l.length - p, l.length) }; },
  equipe() { return BOMBEIROS.map(b => ({ ...b, u: Store.usuario(b.id) })); },
  colab(uid, f = {}) {
    const g = { ...f, bomb: uid }, insps = Dados.insp(g), ats = Dados.at(g), pts = Store.s.equipamentos.filter(e => e.ativo && e.resp === uid);

  }
};

      const base = [Util.fmtDataHora(i.dt), Store.usuario(i.ins).nome, Store.ger(e.ger).nome, CAT[e.cat].nome, e.codigo, e.local, cab.fab ?? e.fab, cab.agente ?? e.dados.agente ?? '', cab.n2 ?? e.dados.n2 ?? '', cab.n3 ?? e.dados.n3 ?? ''];
      const its = itensCols.flatMap(([c, it]) => c !== e.cat ? ['', ''] : [(ck.it && ck.it[it.k]) || (i.ck ? '' : pad[it.k] || 'C'), (ck.desc && ck.desc[it.k]) || '']);
      return [...base, ...its, ck.op?.anel || '', ck.op?.base || '', e.cat === 'extintor' ? (ck.troca || 'Não') : '', ck.motivo || '', ck.qtd?.mangueiras ?? '', ck.qtd?.storz ?? '', ck.qtd?.agulheta ?? '', ck.qtd?.regulavel ?? '', cab.kitVenc || '', e.cat === 'chuveiro' ? ((ck.press ?? e.dados.press) ? 'Sim' : 'Não') : '', i.obs, i.fotos.length, i.st === 'ok' ? 'Conforme' : 'Não conforme']; });
    return [head, ...rows];
  }
};

/* ---------- fotos ---------- */
const Fotos = {
  async comprimir(file) {
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((ok, err) => { const i = new Image(); i.onload = () => ok(i); i.onerror = err; i.src = url; });
      const max = 480, k = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      return cv.toDataURL('image/jpeg', .72);
    } finally { URL.revokeObjectURL(url); }
  },
  /* imagem ilustrativa para testar no computador, sem câmera */
  exemplo(e) {
    const cv = document.createElement('canvas'); cv.width = 400; cv.height = 300; const c = cv.getContext('2d');
    if (!c.roundRect) c.roundRect = function (x, y, w, h) { this.rect(x, y, w, h); };
    const gr = c.createLinearGradient(0, 0, 400, 300); gr.addColorStop(0, '#5B6B7A'); gr.addColorStop(1, '#2C3A47'); c.fillStyle = gr; c.fillRect(0, 0, 400, 300);
    c.fillStyle = e.cat === 'extintor' ? '#C0362C' : e.cat === 'hidrante' ? '#B8322A' : e.cat === 'chuveiro' ? '#2E9E5B' : '#E3A21A';
    if (e.cat === 'extintor') { c.beginPath(); c.roundRect(170, 70, 60, 190, 18); c.fill(); c.fillStyle = '#222'; c.fillRect(185, 45, 30, 28); }
    else { c.beginPath(); c.roundRect(130, 60, 140, 190, 10); c.fill(); }
    c.fillStyle = 'rgba(0,0,0,.55)'; c.fillRect(0, 262, 400, 38); c.fillStyle = '#fff'; c.font = '600 15px Inter, Arial'; c.fillText(`${e.codigo} · ${Util.fmtDataHora(new Date())}`, 12, 286);
    return cv.toDataURL('image/jpeg', .72);
  }
};

/* ---------- sincronização simulada ---------- */
const Sync = {
  enviar() {
    const fila = Regras.fila(); if (!fila.length || Store.s.offline || Store._enviando) return;
    Store._enviando = true; Router.renderChrome();
    setTimeout(() => { fila.forEach(i => i.sync = 'enviado'); Store._enviando = false; Store.salvar(); UI.toast(`${Util.plural(fila.length, 'inspeção enviada', 'inspeções enviadas')} ao servidor.`); Router.render(); }, 1400);
  }
};

/* ---------- salvar inspeção ---------- */
function salvarInspecao() {
  const f = Store._form, e = Store.eq(f.eq), err = document.getElementById('insp-err');
  const faltas = Form.pendencias(e, f);
  if (faltas.length) { err.innerHTML = faltas.map(esc).join('<br>'); err.scrollIntoView({ block:'center', behavior:'smooth' }); return; }
  const agora = new Date(), per = CAT[e.cat].per, itens = Form.itens(e, f);
  const ncs = itens.filter(it => f.it[it.k] === 'NC').map(it => `${it.l}: ${f.desc[it.k].trim()}`);
  if (f.troca === 'Sim') ncs.push(`Troca do extintor: ${f.motivo}`);
  if (f.gatilho && f.gatilho !== 'Não') ncs.push(`Gatilho: ${f.gatilho}`);
  const st = ncs.length ? 'nc' : 'ok';
  const ck = { it: { ...f.it }, desc: { ...f.desc }, cab: { ...f.cab }, op: { ...f.op }, qtd: { ...f.qtd }, press: f.press, troca: f.troca, motivo: f.motivo, gatilho: f.gatilho };
  // alterações de cadastro (conferidas na etiqueta)
  const mud = [];
  const setD = (k, rot) => { if ((f.cab[k] || '') !== (e.dados[k] || '')) { e.dados[k] = f.cab[k]; mud.push(rot); } };
  if (e.cat === 'extintor') { if (f.cab.fab !== e.fab) { e.fab = f.cab.fab; mud.push('nº do cilindro'); } setD('agente','agente'); setD('n2','N2'); setD('n3','N3'); e.dados.anel = f.op.anel; e.dados.base = f.op.base; }
  if (e.cat === 'hidrante') { setD('thUlt','teste hidrostático'); setD('thProx','próximo teste'); e.dados.qtd = { ...f.qtd }; }
  if (e.cat === 'maca') setD('kitVenc','vencimento do kit');
  if (e.cat === 'chuveiro' && !!e.dados.press !== f.press) { e.dados.press = f.press; mud.push('pressurizado'); }
  const reg = { id: Util.uuid(), eq: e.id, dt: agora.toISOString(), ciclo: Ciclos.de(agora, per), per, st, ck, resumo: ncs.join(' · '), obs: f.obs.trim(), fotos: f.fotos.slice(), ins: Store.eu.id, origem: f.origem || 'busca', anulada:false, sync: Store.s.offline ? 'fila' : 'enviado', sim:false };
  Store.s.inspecoes.push(reg); Store.salvar(); Store.reindexar(); Store._form = null;
  if (Store._busca?.q) Acoes._guardarRecente(Store._busca.q);
  const prox = Regras.proximoPendente(e);
  UI.dialogo({ corpo:`<div class="success ${st}"><div class="ic">${ico(st === 'ok' ? 'check' : 'alert')}</div><h2>${esc(e.codigo)} — ${st === 'ok' ? 'Conforme' : 'Não conforme'}</h2><p>${Store.s.offline ? 'Salvo no aparelho. Será enviado quando a conexão voltar.' : 'Inspeção registrada e enviada.'}${st === 'nc' ? ' A NC foi adicionada à lista de abertas.' : ''}</p>${st === 'nc' ? `<p class="hint" style="margin-top:8px">${esc(reg.resumo)}</p>` : ''}${mud.length ? `<p class="hint" style="margin-top:8px">Cadastro atualizado: ${esc(mud.join(', '))}.</p>` : ''}${prox ? `<p class="hint" style="margin-top:10px">Próximo pendente perto: <b>${esc(prox.codigo)}</b> · ${esc(prox.local)}</p>` : ''}</div>`,
    rodape:`${f.gatilho && f.gatilho !== 'Não' ? `<a class="btn btn-danger" href="#/atendimento/novo?eq=${e.id}&origem=inspecao&gatilho=${Object.keys(GATILHOS).find(k => GATILHOS[k].nome === f.gatilho)}&insp=${reg.id}&desc=${encodeURIComponent(reg.resumo)}" data-action="fechar-dlg">${ico('headset')}Abrir atendimento</a>` : ''}<a class="btn btn-sec" href="#/nova?ger=${e.ger}&cat=${e.cat}" data-action="fechar-dlg">Lista</a>${prox ? `<a class="btn btn-pri" href="#/inspecao/${prox.id}?de=lista" data-action="fechar-dlg">Próximo: ${esc(prox.codigo)}</a>` : `<a class="btn btn-pri" href="#/inicio" data-action="fechar-dlg">Início</a>`}` });
}

/* =====================================================================
   ROTEADOR (hash) — #/rota/param?query
   ===================================================================== */
const Router = {
  titulos: { inicio:'Início', buscar:'Buscar equipamento', ncs:'Não conformidades', historico:'Histórico', relatorios:'Relatórios', admin:'Administração', menu:'Menu', inspecao:'Registrar inspeção', ficha:'Ficha do equipamento', lista:'' },
  parse() {
    const h = location.hash.replace(/^#\/?/, '') || 'inicio';
    const [caminho, qs] = h.split('?'); const [rota, param] = caminho.split('/');
    return { rota, param, q: new URLSearchParams(qs || '') };
  },
  _shell: false,
  render(forcar) {
    const eu = Store.eu, root = document.getElementById('root');
    if (!eu) { this._shell = false; root.innerHTML = V.login(); document.title = 'Inspec — Entrar'; Router.ligarLogin(); return; }
    if (eu.trocar) { this._shell = false; root.innerHTML = V.trocaSenha(); Router.ligarTroca(); return; }
    let { rota, param, q } = this.parse();
    if (rota === 'login') { location.replace('#/inicio'); return; }
    if (!this._shell || forcar) { root.innerHTML = V.shell(); this._shell = true; }
    const view = document.getElementById('view');
    const wide = ['relatorios','admin','historico','ncs'].includes(rota);
    view.className = 'view' + (wide ? ' wide' : '');
    let html, titulo = this.titulos[rota] ?? '', voltar = null, ativo = rota;
    switch (rota) {
      case 'inicio':
        if (Regras.pode('admin')) { html = V.painel(q); titulo = 'Painel de gestão'; ativo = 'inicio'; view.className = 'view wide'; }
        else if (Store.eu.papel === 'consulta') { html = V.inicioConsulta(); view.className = 'view wide'; }
        else html = V.inicio();
        break;
      case 'painel': html = V.painel(q); titulo = 'Painel de gestão'; ativo = Regras.pode('admin') ? 'inicio' : 'painel'; view.className = 'view wide'; break;
      case 'atendimentos': html = V.atendimentos(q); titulo = 'Atendimentos'; ativo = 'atends'; view.className = 'view wide'; break;
      case 'atendimento': if (param === 'novo') { html = V.atendNovo(q); titulo = 'Novo atendimento'; ativo = 'atend'; } else { const a = (Store.s.atendimentos || []).find(x => x.id === param); html = V.atendDet(param, q); titulo = a ? a.num : 'Atendimento'; voltar = '#/atendimentos'; ativo = 'atends'; } break;
      case 'lista': html = V.lista(param, q); titulo = CAT[param]?.plural || ''; voltar = '#/inicio'; ativo = 'inicio'; break;
      case 'buscar': html = V.buscar(q); break;
      case 'q': { const r = QR.resolver('/Q/' + (param || '')); location.replace('#/buscar'); if (r.erro) UI.toast(r.erro); else setTimeout(() => Scan.acao(r), 0); return; }
      case 'nova': html = V.nova(q); titulo = 'Nova inspeção'; ativo = 'nova'; if (q.get('ger')) voltar = q.get('cat') ? `#/nova?ger=${q.get('ger')}` : '#/nova'; break;
      case 'inspecao': html = V.inspecao(param, q); voltar = q.get('de') === 'lista' ? `#/nova?ger=${Store.eq(param)?.ger}&cat=${Store.eq(param)?.cat}` : '#/buscar'; ativo = q.get('de') === 'lista' ? 'nova' : 'buscar'; break;
      case 'ficha': html = V.ficha(param); voltar = '#/inicio'; ativo = ''; break;
      case 'ncs': html = V.ncs(q); break;
      case 'historico': html = V.historico(q); break;
      case 'relatorios': html = V.central(false); view.className = 'view wide'; voltar = innerWidth < 960 ? '#/menu' : null; break;
      case 'admin': html = V.admin(param || 'equipamentos', q); voltar = innerWidth < 960 ? '#/menu' : null; break;
      case 'menu': html = V.menu(); break;
      default: html = V.naoEncontrado();
    }
    if (html === '') return;
    view.innerHTML = html;
    renderNav(ativo); renderTop({ titulo, voltar });
    document.title = `Inspec — ${titulo || 'Início'}`;
    if (rota === 'buscar') { const i = document.getElementById('busca'); if (i && innerWidth >= 700) i.focus(); }
  },
  renderChrome() { if (this._shell) { const { rota } = this.parse(); renderNav(rota); renderTop({ titulo: this.titulos[rota] || '', voltar: null }); } },
  ligarLogin() {
    document.getElementById('form-login').addEventListener('submit', ev => {
      ev.preventDefault();
      const email = document.getElementById('lg-email').value, senha = document.getElementById('lg-senha').value;
      const err = document.getElementById('lg-err');
      if (!email || !senha) { err.textContent = 'Informe e-mail e senha.'; return; }
      err.textContent = Auth.entrar(email, senha);
    });
  },
  ligarTroca() {
    document.getElementById('form-troca').addEventListener('submit', ev => {
      ev.preventDefault();
      const a = document.getElementById('ts-1').value, b = document.getElementById('ts-2').value, err = document.getElementById('ts-err');
      if (a.length < 8) { err.textContent = 'A senha precisa ter ao menos 8 caracteres.'; return; }
      if (a !== b) { err.textContent = 'As senhas não são iguais.'; return; }
      Object.assign(Store.eu, { senha: a, trocar: false }); Store.salvar();
      UI.toast('Senha definida. Bem-vindo ao Inspec!'); location.hash = '#/inicio'; Router.render(true);
    });
  }
};

/* =====================================================================
   EVENTOS GLOBAIS
   ===================================================================== */
document.addEventListener('click', ev => {
  if (Cal.st && !ev.target.closest('#calpop') && !ev.target.closest('[data-action="cal-open"]')) Cal.fechar();
  if (ev.target.closest('#dlg a[href^="#/"]')) UI.fechar();
  const el = ev.target.closest('[data-action]'); if (!el) return;
  const fn = Acoes[el.dataset.action]; if (!fn) return;
  if (el.tagName !== 'A') ev.preventDefault();
  fn(el, ev);
});
let tBusca;
document.addEventListener('input', ev => {
  const k = ev.target.dataset?.input; if (!k) return; const v = ev.target.value;
  const ger = ['f-ger-inicio','f-ger-ncs'];
  if (ger.includes(k)) { Store.s.ui.gerFiltro = v; Store.salvar(); Router.render(); return; }
  switch (k) {
    case 'f-ger-lista': { const { param, q } = Router.parse(); location.hash = `#/lista/${param}?ger=${encodeURIComponent(v)}&aba=${q.get('aba') || 'pendentes'}`; break; }
    case 'f-cat-ncs': location.hash = `#/ncs?cat=${v}`; break;
    case 'busca': Store._busca.q = v; clearTimeout(tBusca); tBusca = setTimeout(() => Acoes._atualizarBusca(), 120); break;
    case 'f-ger-busca': Store._busca.ger = v; Acoes._atualizarBusca(); break;
    case 'insp-obs': Store._form.obs = v; break;
    case 'pf-mes': case 'pf-ger': case 'pf-bomb': case 'pf-cat': Painel.f()[k.slice(3)] = v; Router.render(); break;
    case 'etq': Store._etq[ev.target.dataset.k] = v; if (ev.target.dataset.k !== 'pular') V.dlgEtiquetas(); break;
    case 'at-q': clearTimeout(tBusca); tBusca = setTimeout(() => { const { q } = Router.parse(); v ? q.set('q', v) : q.delete('q'); history.replaceState(null, '', `#/atendimentos?${q}`); const inp = document.activeElement, pos = inp.selectionStart; Router.render(); const n = document.querySelector('[data-input="at-q"]'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }, 250); break;
    case 'at-f': Store._at[ev.target.dataset.k] = v; if (['dtAcion','dtChegada'].includes(ev.target.dataset.k)) { clearTimeout(tBusca); tBusca = setTimeout(() => Acoes._reAt(), 400); } break;
    case 'at-chk': Store._at[ev.target.dataset.k] = ev.target.checked; break;
    case 'at-dest': { const d = Store._at.dest, val = ev.target.value; Store._at.dest = ev.target.checked ? [...new Set([...d, val])] : d.filter(x => x !== val); break; }
    case 'at-busca': Store._at.busca = v; clearTimeout(tBusca); tBusca = setTimeout(() => { const t = Busca.termos(v); document.getElementById('at-res').innerHTML = V.atRes(t.length ? Atend.buscar(t) : [], t); }, 150); break;
    case 'cab': Store._form.cab[ev.target.dataset.k] = v; break;
    case 'ck-desc': Store._form.desc[ev.target.dataset.k] = v; break;
    case 'nova-f': clearTimeout(tBusca); tBusca = setTimeout(() => { const { q } = Router.parse(); q.set('f', v); history.replaceState(null, '', `#/nova?${q}`); const y = document.getElementById('nova-list'); const tmp = document.createElement('div'); tmp.innerHTML = V.nova(q); y.innerHTML = tmp.querySelector('#nova-list').innerHTML; }, 150); break;
    case 'h-periodo': case 'h-cat': case 'h-ger': case 'h-st': case 'h-ins': case 'h-q':
      Store._hist[k.slice(2).replace('periodo','periodo')] = v; Store._hist.lim = 40; clearTimeout(tBusca); tBusca = setTimeout(() => Acoes._atualizarHist(), k === 'h-q' ? 150 : 0); break;
    case 'r-ciclo': case 'r-ger': { const { q } = Router.parse(); q.set(k.slice(2), v); location.hash = `#/relatorios?${q}`; break; }
    case 'adm-q': Store._adm.q = v; clearTimeout(tBusca); tBusca = setTimeout(() => { document.getElementById('adm-list').innerHTML = V.admEquipLista(); }, 150); break;
    case 'adm-cat': Store._adm.cat = v; document.getElementById('adm-list').innerHTML = V.admEquipLista(); break;
  }
});
document.addEventListener('change', async ev => {
  const k = ev.target.dataset?.input;
  if (k === 'foto' && ev.target.files[0]) {
    try { const d = Acoes._draft(); d.fotos.push(await Fotos.comprimir(ev.target.files[0])); document.getElementById('thumbs').innerHTML = V.thumbs(d); }
    catch (e) { UI.toast('Não foi possível ler a imagem.'); }
  }
  if (k === 'imp-file' && ev.target.files[0]) document.getElementById('imp-prev').innerHTML = V.importPrevia(ev.target.files[0].name);
});
document.addEventListener('submit', ev => { if (ev.target.id === 'form-insp') { ev.preventDefault(); salvarInspecao(); } if (ev.target.id === 'form-at') { ev.preventDefault(); Atend.salvar(); } });
window.addEventListener('message', ev => { if (ev.data === 'inspec-xlsx' && typeof window.__inspecXlsx === 'function') window.__inspecXlsx(); });
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && Cal.st) { Cal.fechar(); return; }
  if (ev.key === 'Escape' && Scan.st) { Scan.fechar(); return; }
  if (ev.key === 'Enter' && ev.target.id === 'busca') { ev.preventDefault(); Acoes._guardarRecente(ev.target.value); const a = document.querySelector('#busca-res .row'); if (a) location.hash = a.getAttribute('href'); }
});
/* tooltip dos gráficos */
document.addEventListener('mousemove', ev => { const el = ev.target.closest('[data-tip]'); UI.tip(el, ev); });
document.addEventListener('focusin', ev => { if (!ev.target.closest('[data-tip]')) UI.tip(null); });
window.addEventListener('hashchange', () => { Store._veioDeDentro = true; Router.render(); window.scrollTo(0, 0); });
document.getElementById('scan-foto').addEventListener('change', ev => Scan.foto(ev.target.files[0]));
window.addEventListener('hashchange', () => Scan.st && Scan.fechar());
window.addEventListener('scroll', () => { if (Cal.st && innerWidth > 620) Cal.fechar(); }, { passive: true });
window.addEventListener('resize', () => { clearTimeout(Router._rz); Router._rz = setTimeout(() => Store.eu && !Store.eu.trocar && Router.render(), 200); });

/* ---------- início ---------- */
Store.carregar();
Router.render(true);
if (!Store.eu) { try { if (!sessionStorage.getItem('inspec-guia')) { sessionStorage.setItem('inspec-guia', '1'); setTimeout(V.dlgGuia, 400); } } catch (e) {} }
