  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --font-h:"Poppins","Inter",system-ui,sans-serif;
  --side:248px; --top:60px; --demo:36px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
h1,h2,h3{font-family:var(--font-h);color:var(--navy-ink);margin:0;line-height:1.2}
:focus-visible{outline:3px solid #6FC7AE;outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- barra de demonstração ---------- */
.demo-bar{position:fixed;top:0;left:0;right:0;height:var(--demo);z-index:50;background:linear-gradient(90deg,#082646,#0A2F57);color:#DDEBF7;display:flex;align-items:center;justify-content:center;gap:10px;font-size:12.5px;padding:0 10px}
.demo-bar b{color:#fff;font-weight:600}
.demo-bar .dot{width:7px;height:7px;border-radius:50%;background:#35D3A6;flex:none}
.demo-bar button{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:999px;padding:3px 10px;font-size:12px}
.demo-bar button:hover{background:rgba(255,255,255,.2)}
@media (max-width:520px){.demo-bar .txt-long{display:none}}

/* ---------- login ---------- */
.login{min-height:100vh;padding:calc(var(--demo) + 24px) 16px 32px;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 500px at 10% -10%,#E0F3EC 0,transparent 60%),radial-gradient(900px 500px at 110% 110%,#DDE8F4 0,transparent 55%),var(--bg)}
.login-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 40px rgba(10,47,87,.10);padding:28px 24px 22px}
.login-card .logo{display:block;width:230px;max-width:80%;margin:4px auto 6px}
.login-card .lead{text-align:center;color:var(--muted);font-size:13.5px;margin:0 0 20px}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.input,.select,.textarea{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 12px;min-height:46px;outline:none;transition:border-color .15s}
.input:focus,.select:focus,.textarea:focus{border-color:var(--green)}
.textarea{min-height:88px;resize:vertical}
.select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#6B7C8D 50%),linear-gradient(135deg,#6B7C8D 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.err{color:var(--red);font-size:13px;min-height:18px;margin:2px 0 8px}
.hint{color:var(--muted);font-size:12.5px}
.linkbtn{background:none;border:0;color:var(--blue);padding:6px 0;font-weight:500}
.demo-access{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line)}
.demo-access .t{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.demo-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.demo-grid button{border:1px solid var(--line);background:#F8FAFC;border-radius:10px;padding:8px 10px;text-align:left;font-size:13px;line-height:1.25}
.demo-grid button b{display:block;color:var(--navy-ink);font-size:13.5px}
.demo-grid button span{color:var(--muted);font-size:11.5px}
.demo-grid button:hover{border-color:var(--green);background:var(--green-soft)}

/* ---------- botões ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;border:1.5px solid transparent;padding:10px 16px;min-height:46px;font-weight:600;text-decoration:none;transition:background .15s,border-color .15s}
.btn svg{width:18px;height:18px}
.btn-pri{background:var(--green);color:#fff}
.btn-pri:hover{background:var(--green-2)}
.btn-navy{background:var(--navy);color:#fff}
.btn-navy:hover{background:var(--navy-2)}
.btn-sec{background:#fff;color:var(--navy-ink);border-color:var(--line)}
.btn-sec:hover{border-color:#B8C6D3}
.btn-danger{background:#fff;color:var(--red);border-color:var(--red-line)}
.btn-danger:hover{background:var(--red-bg)}
.btn-block{width:100%}
.btn-sm{min-height:36px;padding:6px 12px;font-size:13.5px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:10px;border:0;background:transparent;color:var(--navy-ink)}
.iconbtn:hover{background:var(--line-2)}
.iconbtn svg{width:22px;height:22px}

/* ---------- casca do app ---------- */
.shell{min-height:100vh;padding-top:var(--demo)}
.top{position:sticky;top:var(--demo);z-index:20;height:var(--top);background:rgba(255,255,255,.96);backdrop-filter:saturate(1.4) blur(6px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 12px}
.top .brand{display:flex;align-items:center;gap:8px;text-decoration:none}
.top .brand img{width:32px;height:32px}
.top .brand b{font-family:var(--font-h);font-size:20px;color:var(--navy);letter-spacing:-.01em}
.top .title{font-family:var(--font-h);font-weight:600;font-size:17px;color:var(--navy-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.top .spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;white-space:nowrap;border:0}
.pill .d{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill-on{background:var(--ok-bg);color:var(--ok)}
.pill-off{background:var(--amber-bg);color:var(--amber)}
.pill-sync{background:var(--blue-bg);color:var(--blue)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;border:0}
.side{display:none}
.main{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.view{max-width:760px;margin:0 auto;padding:16px}
.view.wide{max-width:1100px}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
.bottom a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;color:var(--muted);text-decoration:none;font-size:11px;font-weight:600;border-radius:10px;position:relative}
.bottom a svg{width:23px;height:23px}
.bottom a[aria-current="page"]{color:var(--green-2)}
.bottom a[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--green)}
.badge-n{position:absolute;top:2px;right:calc(50% - 22px);background:var(--red);color:#fff;border-radius:999px;font-size:10px;min-width:17px;height:17px;display:inline-flex;align-items:center;justify-content:center;padding:0 4px}
@media (min-width:960px){
  .side{display:flex;flex-direction:column;position:fixed;top:var(--demo);bottom:0;left:0;width:var(--side);background:#fff;border-right:1px solid var(--line);padding:16px 12px;z-index:25}
  .side .logo{width:170px;margin:4px 8px 18px}
  .side a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--ink-2);text-decoration:none;font-weight:600;font-size:14px;position:relative;white-space:nowrap}
  .side a svg{width:21px;height:21px;flex:none}
  .side a:hover{background:var(--bg)}
  .side a[aria-current="page"]{background:var(--green-soft);color:var(--green-2)}
  .side .sep{height:1px;background:var(--line);margin:10px 6px}
  .side .who{margin-top:auto;padding:10px 12px;border:1px solid var(--line);border-radius:12px;font-size:13px}
  .side .who b{display:block;color:var(--navy-ink)}
  .side .badge-n{position:static;margin-left:auto}
  .main{margin-left:var(--side);padding-bottom:24px}
  .top .brand{display:none}
  .bottom{display:none}
  .view{padding:24px}
}

/* ---------- componentes ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:14px 16px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 2px 8px}
.sec-h h2{font-size:15.5px}
.sec-h .hint{white-space:nowrap}
.hello h1{font-size:21px}
.hello p{margin:3px 0 0;color:var(--muted);font-size:13.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink-2);min-height:34px}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.chip svg{width:15px;height:15px}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:2px 7px;font-size:11.5px;font-weight:700;white-space:nowrap;letter-spacing:.01em}
.tag svg{width:12px;height:12px}
.t-pend{background:#EEF2F6;color:#4B5E71}
.t-ok{background:var(--ok-bg);color:var(--ok)}
.t-nc{background:var(--red-bg);color:var(--red)}
.t-warn{background:var(--amber-bg);color:var(--amber)}
.t-lost{background:var(--red);color:#fff}
.t-info{background:var(--blue-bg);color:var(--blue)}
.t-off{background:#EEF2F6;color:#6B7C8D;text-decoration:line-through}
.t-fila{background:var(--amber-bg);color:var(--amber)}
.cycle-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.cycle{flex:1;min-width:210px;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.cycle .ic{width:36px;height:36px;border-radius:10px;background:var(--green-soft);color:var(--green-2);display:flex;align-items:center;justify-content:center;flex:none}
.cycle .ic svg{width:20px;height:20px}
.cycle b{display:block;font-size:14px;color:var(--navy-ink)}
.cycle span{font-size:12.5px;color:var(--muted)}
.cycle.warn .ic{background:var(--amber-bg);color:var(--amber)}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.cat-grid{grid-template-columns:1fr}}
.cat{display:block;text-decoration:none;color:inherit;padding:14px;border-radius:var(--radius);background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
.cat:hover{border-color:#9FD8C6}
.cat .h{display:flex;align-items:center;gap:10px}
.cat .h .ic{width:38px;height:38px;border-radius:10px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.cat .h .ic svg{width:21px;height:21px}
.cat .h b{font-family:var(--font-h);font-size:15px;color:var(--navy-ink);display:block}
.cat .h span{font-size:12px;color:var(--muted)}
.cat .num{display:flex;align-items:baseline;gap:6px;margin:12px 0 6px}
.cat .num strong{font-family:var(--font-h);font-size:28px;color:var(--navy-ink);line-height:1}
.cat .num span{color:var(--muted);font-size:13px}
.cat.done .num strong{color:var(--ok)}
.bar{height:8px;border-radius:999px;background:var(--line-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#00A87E,#37D39F)}
.cat .foot{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.alert-card{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--radius);text-decoration:none;color:inherit;border:1px solid}
.alert-card .ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.alert-card .ic svg{width:21px;height:21px}
.alert-card b{display:block;font-size:14.5px}
.alert-card span{font-size:12.5px;color:var(--ink-2)}
.alert-card .n{margin-left:auto;font-family:var(--font-h);font-size:24px;font-weight:700}
.a-red{background:var(--red-bg);border-color:var(--red-line)}
.a-red .ic{background:#fff;color:var(--red)} .a-red b,.a-red .n{color:var(--red)}
.a-amber{background:var(--amber-bg);border-color:var(--amber-line)}
.a-amber .ic{background:#fff;color:var(--amber)} .a-amber b,.a-amber .n{color:var(--amber)}
.a-ok{background:var(--ok-bg);border-color:#B8E2CB}
.a-ok .ic{background:#fff;color:var(--ok)} .a-ok b{color:var(--ok)}
.stack{display:grid;gap:10px}
.big-search{display:flex;align-items:center;gap:10px;width:100%;margin-top:14px;padding:14px 16px;border-radius:14px;background:var(--navy);color:#fff;text-decoration:none;font-weight:600;font-size:15.5px;box-shadow:0 6px 18px rgba(10,47,87,.22)}
.big-search svg{width:22px;height:22px}
.big-search span{opacity:.75;font-weight:400;font-size:13px;margin-left:auto}

/* lista de equipamentos */
.list{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.group-h{position:sticky;top:calc(var(--demo) + var(--top));z-index:5;background:#F6F9FB;border-bottom:1px solid var(--line);padding:7px 14px;font-size:12px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em;display:flex;justify-content:space-between}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line-2);text-decoration:none;color:inherit;background:#fff;width:100%;text-align:left;border-left:0;border-right:0;border-top:0}
.row:last-child{border-bottom:0}
.row:hover{background:#F9FBFC}
.row .ic{width:36px;height:36px;border-radius:10px;background:var(--bg);color:var(--navy);display:flex;align-items:center;justify-content:center;flex:none}
.row .ic svg{width:20px;height:20px}
.row .body{flex:1;min-width:0}
.row .l1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row .code{font-weight:700;color:var(--navy-ink);font-size:15px;font-variant-numeric:tabular-nums}
.row .l2{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .l3{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .chev{color:#A9B7C4;flex:none}
.row .chev svg{width:18px;height:18px}
mark{background:#FFE9A8;color:inherit;border-radius:3px;padding:0 1px}
.tabs{display:flex;gap:4px;background:#E7EDF3;padding:4px;border-radius:12px;overflow-x:auto;scrollbar-width:none}
.tabs button,.tabs a{flex:1;white-space:nowrap;border:0;background:transparent;padding:8px 12px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--ink-2);text-decoration:none;text-align:center}
.tabs [aria-selected="true"]{background:#fff;color:var(--navy-ink);box-shadow:var(--shadow)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.toolbar>*{flex:1;min-width:150px}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty svg{width:40px;height:40px;color:#B6C4D1;margin-bottom:6px}
.empty b{display:block;color:var(--ink-2);font-size:15px;margin-bottom:4px}
.more{display:block;width:100%;border:0;border-top:1px solid var(--line);background:#F8FAFC;padding:12px;font-weight:600;color:var(--blue)}

/* busca */
.search-box{position:relative}
.search-box svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:22px;height:22px;color:var(--muted);pointer-events:none}
.search-box .input{padding-left:46px;min-height:54px;font-size:16.5px;border-radius:14px;border-width:2px}
.search-box .clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);}
.search-box .clear svg{position:static;transform:none;width:18px;height:18px}
.res-count{font-size:13px;color:var(--muted);margin:12px 2px 8px}
.sugg{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.sugg .card{padding:14px}
.sugg h3{font-size:14px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.sr-ico{width:17px;height:17px;flex:none;vertical-align:-3px}

/* inspeção */
.eq-head{padding:16px}
.eq-head .top-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.eq-head .code{font-family:var(--font-h);font-size:26px;font-weight:700;color:var(--navy-ink);letter-spacing:-.01em}
.eq-head .desc{margin:4px 0 10px;color:var(--ink-2);font-size:14.5px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13.5px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;color:var(--ink);font-weight:500}
.notice{display:flex;gap:10px;padding:11px 13px;border-radius:10px;font-size:13.5px;margin:12px 0 0;border:1px solid}
.notice svg{width:19px;height:19px;flex:none;margin-top:1px}
.n-amber{background:var(--amber-bg);border-color:var(--amber-line);color:#6B4700}
.n-info{background:var(--blue-bg);border-color:#C5DCF1;color:#174D7D}
.n-red{background:var(--red-bg);border-color:var(--red-line);color:#8A241C}
.n-ok{background:var(--ok-bg);border-color:#B8E2CB;color:#145E3C}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.choice button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:84px;border-radius:14px;border:2px solid var(--line);background:#fff;font-weight:700;font-size:16px}
.choice button svg{width:28px;height:28px}
.choice .c-ok{color:var(--ok)}
.choice .c-nc{color:var(--red)}
.choice .c-ok[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.choice .c-nc[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.lbl{font-size:13px;font-weight:700;color:var(--ink-2);margin:16px 0 6px;display:flex;justify-content:space-between}
.lbl .req{color:var(--red);font-weight:600}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;width:84px;height:84px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--bg)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.thumb button svg{width:14px;height:14px}
.addphoto{width:84px;height:84px;border-radius:10px;border:2px dashed #B8C6D3;background:#fff;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;cursor:pointer}
.addphoto svg{width:24px;height:24px}
.save-bar{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom));margin-top:16px;padding:10px 0;background:linear-gradient(180deg,rgba(243,246,249,0),var(--bg) 30%)}
@media (min-width:960px){.save-bar{bottom:0}}

/* checklist */
.fsec{margin-top:14px}
.fsec>h3{font-size:15px;display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 2px 8px}
.fsec>h3 .hint{font-family:var(--font);font-weight:500}
.auto{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px;font-size:13.5px}
@media (min-width:720px){.auto{grid-template-columns:repeat(3,minmax(0,1fr))}}
.auto div span{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.auto div b{font-weight:600;color:var(--ink)}
.auto-note{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--green-2);font-weight:600;margin-top:10px}
.auto-note svg{width:15px;height:15px}
.cab{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}
.cab .field{margin-bottom:10px}
.cab .input,.cab .select{min-height:42px;padding:8px 10px}
.ck-item{padding:11px 0;border-bottom:1px solid var(--line-2)}
.ck-item:last-child{border-bottom:0}
.ck-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ck-l{font-weight:600;font-size:14.5px;color:var(--ink)}
.ck-l small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;flex:none;background:#fff}
.seg button{min-width:50px;min-height:42px;border:0;border-left:1px solid var(--line);background:#fff;font-weight:700;color:var(--ink-2);font-size:14px;padding:0 10px}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"][data-v="C"],.seg button[aria-pressed="true"][data-v="Não"]{background:var(--ok);color:#fff}
.seg button[aria-pressed="true"][data-v="NC"],.seg button[aria-pressed="true"][data-v="Sim"]{background:var(--red);color:#fff}
.seg button[aria-pressed="true"][data-v="NA"]{background:#6B7C8D;color:#fff}
.seg.neutral button[aria-pressed="true"]{background:var(--navy)!important;color:#fff}
.ck-nc{margin-top:9px;padding:10px;border-radius:10px;background:var(--red-bg);border:1px solid var(--red-line)}
.ck-nc .input{min-height:42px;margin-top:8px;background:#fff}
.ck-nc .chip{min-height:30px;padding:4px 10px;font-size:12.5px}
.progress-ck{display:flex;align-items:center;gap:10px;margin:2px 2px 10px}
.progress-ck .bar{flex:1}
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.stepper button{width:42px;height:42px;border:0;background:#F4F7FA;font-size:20px;font-weight:700;color:var(--navy)}
.stepper output{min-width:44px;text-align:center;font-weight:700;font-size:16px}
.qtd-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-2)}
.qtd-row:last-child{border-bottom:0}
.qtd-row .hint{display:block}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.step{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;background:#fff;border:1.5px solid var(--line);font-size:13px;font-weight:600;color:var(--ink-2);text-decoration:none}
.step b{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--line);color:var(--ink-2);font-size:11px}
.step.on{border-color:var(--navy);color:var(--navy-ink)}
.step.on b{background:var(--navy);color:#fff}
.step.done b{background:var(--green);color:#fff}
.pick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:720px){.pick-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pick{display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:12px;background:#fff;border:1.5px solid var(--line);text-decoration:none;color:inherit;box-shadow:var(--shadow);min-height:92px}
.pick:hover{border-color:var(--green)}
.pick b{font-family:var(--font-h);font-size:14.5px;color:var(--navy-ink)}
.pick .n{font-family:var(--font-h);font-size:24px;font-weight:700;color:var(--navy-ink);line-height:1}
.pick .n.zero{color:var(--ok)}
.pick .n svg{width:26px;height:26px}
.tbl-wrap .tbl{min-width:560px}
.pick span{font-size:12px;color:var(--muted)}
.pick .ic{width:34px;height:34px;border-radius:9px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center}
.pick .ic svg{width:19px;height:19px}
.quick{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:14px}
.quick .big-search{margin-top:0}
.big-search.sec{background:#fff;color:var(--navy-ink);border:1.5px solid var(--line);box-shadow:var(--shadow)}
.meus{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.ck-det{margin-top:6px;font-size:13px}
.ck-det summary{cursor:pointer;color:var(--blue);font-weight:600}
.ck-det table{margin-top:6px}
/* timeline */
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:14px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line-2)}
.tl li:last-child{border-bottom:0}
.tl .dot{width:12px;height:12px;border-radius:50%;margin-top:4px;background:var(--ok)}
.tl .dot.nc{background:var(--red)}
.tl .dot.an{background:#B6C4D1}
.tl .meta{font-size:12.5px;color:var(--muted)}
.tl .obs{font-size:13.5px;margin-top:3px}
.tl .anulada{opacity:.6}
.tl .anulada .st{text-decoration:line-through}

/* KPI e gráficos */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:720px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--font-h);font-size:26px;font-weight:700;color:var(--navy-ink);line-height:1.15;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--ink-2)}
.chart{padding:14px 16px}
.chart h3{font-size:14.5px}
.chart .sub{font-size:12.5px;color:var(--muted);margin:2px 0 12px}
.hbars{display:grid;gap:9px}
.hbar{display:grid;grid-template-columns:132px 1fr 52px;align-items:center;gap:10px;font-size:13px;position:relative}
.hbar .n{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .track{height:14px;background:var(--line-2);border-radius:4px;position:relative}
.hbar .fill{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--green)}
.hbar .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.hbar:hover .fill{background:var(--green-2)}
.goal{position:absolute;top:-3px;bottom:-3px;width:0;border-left:2px dashed #7C8D9E}
.vbars{display:flex;align-items:flex-end;gap:10px;height:150px;padding:0 4px;border-bottom:1px solid var(--line)}
.vbar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;position:relative}
.vbar .fill{width:100%;max-width:46px;border-radius:4px 4px 0 0;background:var(--navy)}
.vbar.cur .fill{background:var(--green)}
.vbar .v{font-size:12px;font-weight:700;color:var(--ink)}
.vlabels{display:flex;gap:10px;padding:6px 4px 0}
.vlabels span{flex:1;text-align:center;font-size:11.5px;color:var(--muted)}
.tip{position:fixed;z-index:80;pointer-events:none;background:#0B2440;color:#fff;font-size:12.5px;padding:7px 9px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:240px;display:none}
.tip b{display:block}
.grid-2{display:grid;gap:12px}
@media (min-width:900px){.grid-2{grid-template-columns:1fr 1fr}}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:9px 12px;border-bottom:1px solid var(--line);background:#F8FAFC;white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line-2);vertical-align:top}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto}

/* menu */
.menu-list{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.menu-item{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line-2);text-decoration:none;color:inherit;width:100%;background:#fff;border-left:0;border-right:0;border-top:0;text-align:left;font-weight:500}
.menu-item:last-child{border-bottom:0}
.menu-item:hover{background:#F9FBFC}
.menu-item svg{width:21px;height:21px;color:var(--navy)}
.menu-item .r{margin-left:auto;color:var(--muted);font-size:13px}
.switch{position:relative;width:46px;height:26px;border-radius:999px;background:#C9D4DE;border:0;flex:none;margin-left:auto;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--amber)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.profile{display:flex;align-items:center;gap:12px;padding:16px}
.profile .avatar{width:48px;height:48px;font-size:17px}
.profile b{display:block;font-size:16px;color:var(--navy-ink)}
.profile span{font-size:13px;color:var(--muted)}

/* diálogo e toast */
dialog{border:0;border-radius:16px;padding:0;width:min(520px,calc(100vw - 24px));max-height:calc(100vh - 48px);box-shadow:0 20px 60px rgba(0,0,0,.25);color:var(--ink)}
dialog::backdrop{background:rgba(8,24,44,.5)}
dialog.wide{width:min(860px,calc(100vw - 24px))}
.dlg-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.dlg-h h2{font-size:17px;flex:1}
.dlg-b{padding:16px 18px}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);position:sticky;bottom:0;background:#fff}
.success{text-align:center;padding:26px 20px 8px}
.success .ic{width:64px;height:64px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;background:var(--ok-bg);color:var(--ok)}
.success .ic svg{width:34px;height:34px}
.success.nc .ic{background:var(--red-bg);color:var(--red)}
.success h2{font-size:19px}
.success p{color:var(--ink-2);margin:6px 0 0}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;z-index:90;background:#0B2440;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:opacity .2s,transform .2s;max-width:calc(100vw - 32px);pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (min-width:960px){.toast{bottom:28px;left:calc(50% + var(--side)/2)}}
.guide ol{padding-left:20px;margin:0}
.guide li{margin:0 0 10px}
.guide li b{color:var(--navy-ink)}
.report-prev{font-size:13px}
.report-prev .rh{display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--green);padding-bottom:10px;margin-bottom:12px}
.report-prev .rh img{width:150px}
@media print{
  body *{visibility:hidden}
  #dlg,#dlg *{visibility:visible}
  #dlg{position:absolute;inset:0;width:100%;max-height:none;box-shadow:none}
  .dlg-h,.dlg-f{display:none}
}
</style>
</head>

/* =====================================================================
   UTIL
   ===================================================================== */
const Util = {
  esc: s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),
  pad: (n, l=2) => String(n).padStart(l, '0'),
  /* normaliza um caractere por vez (mantém os índices alinhados p/ destacar) */
  normChar: c => c.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(),
  norm: s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(),
  uuid: () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2)),
  fmtData: d => { d = new Date(d); return `${Util.pad(d.getDate())}/${Util.pad(d.getMonth()+1)}/${d.getFullYear()}`; },
  fmtDataHora: d => { d = new Date(d); return `${Util.fmtData(d)} ${Util.pad(d.getHours())}:${Util.pad(d.getMinutes())}`; },
  fmtCurta: d => { d = new Date(d); return `${Util.pad(d.getDate())}/${Util.pad(d.getMonth()+1)} ${Util.pad(d.getHours())}:${Util.pad(d.getMinutes())}`; },
  diasEntre: (a, b) => Math.floor((new Date(b) - new Date(a)) / 864e5),
  plural: (n, s, p) => `${n} ${n === 1 ? s : (p || s + 's')}`,
  pct: (a, b) => b ? Math.round(a * 100 / b) : 0,
  iniciais: nome => String(nome||'?').split(' ').filter(Boolean).slice(0,2).map(p => p[0]).join('').toUpperCase(),
  /* destaca termos da busca sem quebrar acentos nem escapar errado */
  destacar(texto, termos) {
    const t = String(texto ?? '');
    if (!termos.length) return Util.esc(t);
    const n = Array.from(t).map(Util.normChar).join('');
    const marks = new Array(t.length).fill(false);
    for (const q of termos) { let i = n.indexOf(q); while (q && i > -1) { for (let k = i; k < i + q.length; k++) marks[k] = true; i = n.indexOf(q, i + q.length); } }
    let out = '', on = false;
    Array.from(t).forEach((ch, i) => { if (marks[i] && !on) { out += '<mark>'; on = true; } if (!marks[i] && on) { out += '</mark>'; on = false; } out += Util.esc(ch); });
    return out + (on ? '</mark>' : '');
  },
  baixar(nome, conteudo, tipo='text/plain') {
    const blob = new Blob([conteudo], { type: tipo + ';charset=utf-8' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nome;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  },
  csv(linhas) { return '﻿' + linhas.map(l => l.map(v => { const s = String(v ?? ''); return /[";\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; }).join(';')).join('\n'); }
};
const { esc } = Util;

/* =====================================================================
   CICLOS (espelho de app.ciclo_de no banco)
   ===================================================================== */
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const Ciclos = {
  mensal: d => `${d.getFullYear()}-${Util.pad(d.getMonth()+1)}`,
  semanal(d) {
    const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    const dia = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - dia);
    const ano = t.getUTCFullYear();
    const sem = Math.ceil(((t - Date.UTC(ano, 0, 1)) / 864e5 + 1) / 7);
    return `${ano}-W${Util.pad(sem)}`;
  },
  de: (d, per) => per === 'semanal' ? Ciclos.semanal(d) : Ciclos.mensal(d),
  anteriorData: (d, per, n=1) => per === 'semanal' ? new Date(d.getTime() - 7 * 864e5 * n) : new Date(d.getFullYear(), d.getMonth() - n, 15, 12),
  inicioSemana(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const dia = x.getDay() || 7; x.setDate(x.getDate() - dia + 1); return x; },
  rotulo(c) {
    if (c.includes('W')) return `Semana ${Number(c.split('W')[1])}/${c.slice(0,4)}`;
    const [a, m] = c.split('-'); return `${MESES[Number(m)-1]}/${a}`;
  },
  diasRestantesMes(d) { return new Date(d.getFullYear(), d.getMonth()+1, 0).getDate() - d.getDate(); },
  /* prazo: últimos 5 dias do mês / a partir de sexta na semana (RN-11) */
  venceBreve(per, d) { return per === 'semanal' ? [5,6,0].includes(d.getDay()) : Ciclos.diasRestantesMes(d) <= 4; }
};

      if (d.cat === 'hidrante') { const a = 2021 + Math.floor(rnd() * 5), m = 1 + Math.floor(rnd() * 12); Object.assign(e.dados, { thUlt: `${a}-${Util.pad(m)}-10`, thProx: `${a + 5}-${Util.pad(m)}-10`, conferir: d.conf, qtd: { mangueiras: 2, storz: 1, agulheta: rnd() < .8 ? 1 : 0, regulavel: rnd() < .6 ? 1 : 0 } }); }
      if (d.cat === 'maca') { const k = new Date(agora.getFullYear(), agora.getMonth() + Math.floor(rnd() * 16) - 1, 28); e.dados.kitVenc = k.toISOString().slice(0, 10); }
      if (d.cat === 'chuveiro') e.dados.press = !!d.press;
      if (d.cat === 'extintor') e.dados.anel = pick(['Amarelo','Verde','Branco','Azul']), e.dados.base = /carreta/i.test(d.tipo) ? 'Carreta' : pick(['Suporte (parede)','Suporte (parede)','Suporte (parede)','Coluna','Tripé']);
      return e;
    });
    const usuarios = [
      { id:'adm1', nome:'Coordenação SESMT', email:'admin@inspec.demo', papel:'admin', senha:'demo1234', trocar:false, ativo:true },
      ...BOMBEIROS.map(b => ({ id: b.id, nome: b.nome, email: `${b.id}@inspec.demo`, papel:'inspetor', senha: b.id === 'beatriz' ? 'inicial123' : 'demo1234', trocar: b.id === 'beatriz', ativo:true })),
      { id:'cons1', nome:'Gerente de Área', email:'consulta@inspec.demo', papel:'consulta', senha:'demo1234', trocar:false, ativo:true }
    ];
    const equipe = ['glauco','franciele','rosana','flavio','samuel','claudio'];
    const inspecoes = [];
    const mk = (e, data, per, { ins, nc = false, sim = true, ck = null, resumo = '' } = {}) => {
      const d = new Date(data); if (d.getHours() === 0) d.setHours(7 + Math.floor(rnd() * 9), Math.floor(rnd() * 60));
      if (d > agora) d.setTime(agora.getTime() - Math.floor(rnd() * 3600e3));
      if (nc && !ck) {
        const it = pick(itensDe(e, e.dados.press)); const desc = pick(it.sug);
        ck = { it: { [it.k]: 'NC' }, desc: { [it.k]: desc } }; resumo = `${it.l}: ${desc}`;
      }
      inspecoes.push({ id: Util.uuid(), eq: e.id, dt: d.toISOString(), ciclo: Ciclos.de(d, per), per, st: nc ? 'nc' : 'ok', ck, resumo, obs: '', fotos: [],
        ins: ins || e.resp || pick(equipe), origem: 'lista', anulada: false, sync: 'enviado', sim });
    };
    const hoje0 = new Date(agora.getFullYear(), agora.getMonth(), agora.getDate());
    const cm = Ciclos.mensal(agora);
    for (const e of equipamentos) {
      const per = CAT[e.cat].per;
      if (per === 'mensal') {
        for (let k = 2; k >= 1; k--) {
          const b = new Date(agora.getFullYear(), agora.getMonth() - k, 1), dim = new Date(b.getFullYear(), b.getMonth() + 1, 0).getDate();
          if (rnd() < (k === 1 ? .96 : .97)) mk(e, new Date(b.getFullYear(), b.getMonth(), 1 + Math.floor(rnd() * dim)), per, { nc: rnd() < .025 });
        }
        if (e.cat !== 'extintor') {
          const dia = agora.getDate(), dim = new Date(agora.getFullYear(), agora.getMonth() + 1, 0).getDate();
          if (rnd() < Math.min(.88, .1 + .78 * dia / dim)) mk(e, new Date(agora.getFullYear(), agora.getMonth(), 1 + Math.floor(rnd() * dia)), per, { nc: rnd() < .03 });
        }
      } else {
        for (let k = 6; k >= 1; k--) { const ini = Ciclos.inicioSemana(new Date(hoje0.getTime() - 7 * 864e5 * k)); if (rnd() < .95) mk(e, new Date(ini.getTime() + Math.floor(rnd() * 5) * 864e5), per, { nc: rnd() < .03 }); }
        const ini = Ciclos.inicioSemana(hoje0), dp = Util.diasEntre(ini, hoje0);
        if (rnd() < Math.min(.9, .25 + .15 * dp)) mk(e, new Date(ini.getTime() + Math.floor(rnd() * (dp + 1)) * 864e5), per, { nc: rnd() < .03 });
      }
    }
    // Extintores: inspeções REAIS de setembro (coluna UltimaInspecao da planilha)
    const porId = new Map(equipamentos.map(e => [e.id, e]));
    for (const d of DADOS.eqs) {
      if (d.cat !== 'extintor' || !d.ult || !d.ult.startsWith(cm)) continue;
      const e = porId.get(d.id), [a, m, dd] = d.ult.split('-').map(Number);
      const repor = /REPOSI|REPOR/i.test(d.obs || '');
      mk(e, new Date(a, m - 1, dd), 'mensal', { ins: d.resp || 'glauco', sim: false, nc: repor,
        ck: repor ? { it: {}, desc: {}, troca: 'Sim', motivo: '' } : null, resumo: repor ? `Troca do extintor: ${d.obs}` : '' });
    }
    // NCs antigas: a maioria já foi corrigida e reinspecionada
    for (const i of inspecoes.slice()) {
      if (i.st !== 'nc' || !i.sim) continue;
      const atual = i.per === 'mensal' ? cm : Ciclos.semanal(agora);
      if (rnd() < (i.ciclo === atual ? .3 : .9)) { const d = new Date(new Date(i.dt).getTime() + (1 + Math.floor(rnd() * 6)) * 864e5); if (d < agora) inspecoes.push({ ...i, id: Util.uuid(), dt: d.toISOString(), ciclo: Ciclos.de(d, i.per), st: 'ok', ck: null, resumo: '', obs: 'Corrigido e reinspecionado.' }); }
    }
    return {
      versao: 2, criadoEm: agora.toISOString(),
      org: { nome:'Planta Industrial', unidade:'Unidade Principal', fuso:'America/Sao_Paulo' },
      gerencias, equipamentos, usuarios, inspecoes,
      sessao: null, offline: false, ui: { gerFiltro:'', meus: true, recentes: [], ultimoBackup: null }, cfg: { foto: 'todas' }
    };
  }
};

/* =====================================================================
   STORE — estado + persistência local (conveniência da demonstração)
   ===================================================================== */
const CHAVE = 'inspec-prototipo-v2';
const Store = {
  s: null, idx: null,
  carregar() {
    try { const raw = localStorage.getItem(CHAVE); if (raw) { const s = JSON.parse(raw); if (s && s.versao === 2) { this.s = s; } } } catch (e) { /* armazenamento indisponível: segue só em memória */ }
    if (!this.s) this.s = Semente.gerar(new Date());
    this.reindexar();
  },
  salvar() {
    try { localStorage.setItem(CHAVE, JSON.stringify(this.s)); }
    catch (e) { try { this.s.inspecoes.forEach(i => { if (i.fotos.length) i.fotos = i.fotos.slice(0,1); }); localStorage.setItem(CHAVE, JSON.stringify(this.s)); } catch (e2) { /* sem espaço: mantém em memória */ } }
  },
  reiniciar() { try { localStorage.removeItem(CHAVE); } catch (e) {} this.s = Semente.gerar(new Date()); this.reindexar(); this.salvar(); },
  reindexar() {
    const porEq = new Map(), porId = new Map(), eqPorId = new Map();
    for (const e of this.s.equipamentos) eqPorId.set(e.id, e);
    for (const i of this.s.inspecoes) { porId.set(i.id, i); if (!porEq.has(i.eq)) porEq.set(i.eq, []); porEq.get(i.eq).push(i); }
    for (const l of porEq.values()) l.sort((a, b) => b.dt.localeCompare(a.dt));
    this.idx = { porEq, porId, eqPorId, usuarios: new Map(this.s.usuarios.map(u => [u.id, u])), ger: new Map(this.s.gerencias.map(g => [g.id, g])) };
  },
  get eu() { return this.s.sessao ? this.idx.usuarios.get(this.s.sessao.uid) : null; },
  eq: id => Store.idx.eqPorId.get(id),
  ger: id => Store.idx.ger.get(id) || { nome:'—', sigla:'—' },
  usuario: id => Store.idx.usuarios.get(id) || { nome:'(usuário removido)' },
  inspecoesDe: id => Store.idx.porEq.get(id) || []
};

/* =====================================================================
   REGRAS DE NEGÓCIO (RN-03, RN-05, RN-07, RN-11)
   ===================================================================== */
const Regras = {
  agora: () => new Date(),
  cicloAtual: per => Ciclos.de(new Date(), per),
  situacao(e) {
    const per = CAT[e.cat].per, agora = new Date();
    const validas = Store.inspecoesDe(e.id).filter(i => !i.anulada);
    const atual = Ciclos.de(agora, per), anterior = Ciclos.de(Ciclos.anteriorData(agora, per), per);
    const noCiclo = validas.filter(i => i.ciclo === atual);
    const ultima = validas[0] || null;
    const pendente = e.ativo && noCiclo.length === 0;
    const criadoAntes = new Date(e.criado) < Ciclos.anteriorData(agora, per);
    const perdido = pendente && criadoAntes && !validas.some(i => i.ciclo === anterior);
    const ncAberta = e.ativo && ultima && ultima.st === 'nc';
    return { per, atual, noCiclo, ultima, pendente, perdido, ncAberta, vence: pendente && Ciclos.venceBreve(per, agora), statusCiclo: noCiclo[0]?.st || null };
  },
  pode(acao) {
    const p = Store.eu?.papel;
    const mapa = { inspecionar:['owner','admin','inspetor'], admin:['owner','admin'], anular:['owner','admin'], relatorios:['owner','admin','inspetor','consulta'] };
    return (mapa[acao] || []).includes(p);
  },
  /* "Meus pontos": extintores têm bombeiro responsável na planilha; hidrantes, macas e chuveiros são da equipe toda */
  temRota: () => Store.eu && Store.s.equipamentos.some(e => e.resp === Store.eu.id),
  meusAtivo: () => Store.s.ui.meus && Regras.temRota(),
  noMeuFiltro: e => !Regras.meusAtivo() || !e.resp || e.resp === Store.eu.id,
  ativosFiltrados(cat) {
    const g = Store.s.ui.gerFiltro;
    return Store.s.equipamentos.filter(e => e.ativo && (!cat || e.cat === cat) && (!g || e.ger === g) && Regras.noMeuFiltro(e));
  },
  /* validade da recarga (N2) do extintor */
  n2(e) {
    const v = e.dados.n2; if (!v) return null;
    const hoje = Ciclos.mensal(new Date()), [a, m] = v.split('-').map(Number), lim = new Date(a, m + 1, 1);
    const rot = `${Util.pad(m)}/${a}`;
    if (v < hoje) return { st:'vencida', rot }; if (v === hoje) return { st:'mes', rot };
    return lim - new Date() < 75 * 864e5 ? { st:'proxima', rot } : { st:'ok', rot };
  },
  textoNC: i => i ? (i.resumo || i.obs || 'Não conforme') : '',
  resumo(cat) {
    const lista = Regras.ativosFiltrados(cat);
    let pend = 0, nc = 0, perd = 0, venc = 0, feitos = 0, ncCiclo = 0;
    for (const e of lista) { const s = Regras.situacao(e); if (s.pendente) { pend++; if (s.perdido) perd++; if (s.vence) venc++; } else feitos++; if (s.ncAberta) nc++; if (s.statusCiclo === 'nc') ncCiclo++; }
    return { total: lista.length, pend, feitos, nc, perd, venc, ncCiclo };
  },
  ncsAbertas() {
    return Store.s.equipamentos.filter(e => e.ativo && (!Store.s.ui.gerFiltro || e.ger === Store.s.ui.gerFiltro))
      .map(e => ({ e, s: Regras.situacao(e) })).filter(x => x.s.ncAberta)
      .map(x => ({ ...x, desde: Regras.inicioNC(x.e) })).sort((a, b) => a.desde.localeCompare(b.desde));
  },
  /* data da primeira NC da sequência atual (idade da NC) */
  inicioNC(e) {
    const v = Store.inspecoesDe(e.id).filter(i => !i.anulada); let d = v[0]?.dt;
    for (const i of v) { if (i.st === 'nc') d = i.dt; else break; }
    return d;
  },
  fila: () => Store.s.inspecoes.filter(i => i.sync === 'fila'),
  proximoPendente(e) {
    const cands = Store.s.equipamentos.filter(x => x.ativo && x.id !== e.id && x.cat === e.cat && x.ger === e.ger && Regras.noMeuFiltro(x) && Regras.situacao(x).pendente);
    return cands.find(x => x.area === e.area) || cands[0] || null;
  },
  textoBusca(e) {
    const g = Store.ger(e.ger);
    return [e.codigo, CAT[e.cat].nome, CAT[e.cat].plural, e.subtipo, e.dados.agente, g.nome, g.sigla, e.local, e.resp ? Store.usuario(e.resp).nome : '', e.fab ? 'cilindro ' + e.fab : '', e.dados.numOrigem ? 'nº ' + e.dados.numOrigem : ''].join(' · ');
  }
};

const UI = {
  toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(this._t); this._t = setTimeout(() => t.classList.remove('on'), 2800); },
  dialogo({ titulo, corpo, rodape = '', largo = false, aoAbrir }) {

    d.innerHTML = `${titulo ? `<div class="dlg-h"><h2 id="dlg-title">${titulo}</h2><button class="iconbtn" data-action="fechar-dlg" aria-label="Fechar">${ico('x')}</button></div>` : ''}<div class="dlg-b">${corpo}</div>${rodape ? `<div class="dlg-f">${rodape}</div>` : ''}`;
    if (!d.open) d.showModal();
    aoAbrir && aoAbrir(d);
    return d;
  },
  fechar() { const d = document.getElementById('dlg'); if (d.open) d.close(); },
  confirmar({ titulo, texto, ok = 'Confirmar', perigo = false }) {
    return new Promise(res => {
      UI.dialogo({ titulo, corpo: `<p style="margin:0">${texto}</p>`, rodape: `<button class="btn btn-sec" data-action="fechar-dlg">Cancelar</button><button class="btn ${perigo ? 'btn-danger' : 'btn-pri'}" id="dlg-ok">${ok}</button>` });

      document.getElementById('dlg-ok').onclick = () => { res(true); UI.fechar(); };
      d.addEventListener('close', () => res(false), { once: true });

  },
  tip(el, ev) {
    const t = document.getElementById('tip'); if (!el) { t.style.display = 'none'; return; }
    t.innerHTML = el.dataset.tip; t.style.display = 'block';
    const x = Math.min(ev.clientX + 14, innerWidth - t.offsetWidth - 8), y = Math.max(8, ev.clientY - t.offsetHeight - 12);
    t.style.left = x + 'px'; t.style.top = y + 'px';
  }
};

  selectGerencia(id, valor, rotuloTodas = 'Todas as gerências') {

  },
  selectCategoria(id, valor) {

  papel: p => ({ owner:'Owner', admin:'Administrador', inspetor:'Inspetor', consulta:'Consulta' }[p] || p)

function renderTop({ titulo, voltar }) {
